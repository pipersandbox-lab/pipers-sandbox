    label: ['What does "Learning limited" mean?', '¿Qué significa "Aprendizaje limitado"?'],
    kw: ['learning limited', 'aprendizaje limitado', 'limited learning', 'stuck in learning', 'atascado en aprendizaje', 'atascada en aprendizaje', 'not exiting learning', 'no sale del aprendizaje'],
    en: "Learning limited means Meta expects the ad set won't reach ~50 results in 7 days. Common causes: budget too small, audience too narrow, too many ad sets splitting the money, or an optimization event that's too rare. Fixes: combine ad sets, broaden the audience, raise budget, or optimize for a more frequent event (like add-to-cart).",
    es: 'Aprendizaje limitado significa que Meta espera que el conjunto no llegue a unos 50 resultados en 7 días. Causas comunes: presupuesto muy bajo, público muy limitado, demasiados conjuntos repartiendo el dinero, o un evento de optimización muy raro. Soluciones: juntar conjuntos, ampliar el público, subir el presupuesto u optimizar para un evento más frecuente (como agregar al carrito).',
    rel: ['fifty_rule', 'audience_size', 'conversion_event'] },
  { id: 'fifty_rule',
    label: ['The 50-conversions-in-7-days rule', 'La regla de 50 conversiones en 7 días'],
    kw: ['50 conversions', '50 conversiones', '50/7', '50 in 7', '50 en 7', 'fifty conversions', 'cincuenta conversiones', 'exit learning', 'salir del aprendizaje', 'how to exit', 'como salir'],
    en: "Meta generally needs about 50 optimization events (sales, leads…) within 7 days to exit learning. Quick math: 50 ÷ 7 ≈ 7 results a day, so your daily budget should be around 7 × your expected CPA. If that's too much, optimize for an earlier, more frequent step.",
    es: 'Meta generalmente necesita unos 50 eventos de optimización (ventas, clientes potenciales…) en 7 días para salir del aprendizaje. Cálculo rápido: 50 ÷ 7 ≈ 7 resultados al día, así que tu presupuesto diario debería ser cerca de 7 × tu CPA esperado. Si eso es demasiado, optimiza para un paso anterior y más frecuente.',
    rel: ['learning_limited', 'budget', 'conversion_event'] },
  { id: 'dont_panic',
    label: ['My first days look bad — should I change it?', 'Mis primeros días se ven mal, ¿lo cambio?'],
    kw: ['@early & @problem', '@early & @sales', 'panic*', 'panico', 'bad first day*', 'mal primer dia', 'malos primeros dias', 'day 2', 'dia 2', 'day 3', 'dia 3', 'early results', 'primeros resultados', 'should i edit', 'debo editar', 'should i change it', 'lo cambio', 'first days', 'primeros dias', 'terrible results', 'resultados terribles'],
    en: "Probably not! Days 1–7 are noisy by design. Rewriting everything on Day 2 resets learning and you pay to start over. Unless something is clearly broken (wrong link, wrong audience, a typo), wait for Day 8 data, then decide.",
    es: '¡Probablemente no! Los días 1–7 tienen ruido a propósito. Reescribir todo el día 2 reinicia el aprendizaje y pagas por empezar de nuevo. A menos que algo esté claramente mal (enlace equivocado, público equivocado, un error de escritura), espera los datos del día 8 y luego decide.',
    rel: ['when_judge', 'significant_edit', 'client_questions'] },
  { id: 'significant_edit',
    label: ['What resets the Learning Phase?', '¿Qué reinicia la Fase de aprendizaje?'],
    kw: ['reset & learning', 'reinici* & aprendizaje', 'restart & learning', 'significant edit*', 'cambio significativo', 'cambios significativos', 'reset learning', 'reiniciar el aprendizaje', 'reinicia el aprendizaje', 'que reinicia', 'what resets', 'restart learning', 'edits reset'],
    en: "Significant edits restart learning: changing targeting, the creative, the optimization event, or the bid strategy; adding a new ad; big budget jumps; or pausing for 7+ days. Small budget tweaks (~20%) and turning things on/off briefly are usually fine.",
    es: 'Los cambios significativos reinician el aprendizaje: cambiar la segmentación, el anuncio, el evento de optimización o la estrategia de puja; agregar un anuncio nuevo; saltos grandes de presupuesto; o pausar 7 días o más. Ajustes pequeños de presupuesto (~20%) y apagar y encender por poco tiempo normalmente están bien.',
    rel: ['budget_change', 'dont_panic', 'pause'] },
  { id: 'when_judge',
    label: ['When can I trust my results?', '¿Cuándo puedo confiar en mis resultados?'],
    kw: ['trust & result*', 'confiar & resultado*', 'when to judge', 'cuando juzgar', 'day 8', 'dia 8', 'when can i trust', 'cuando puedo confiar', 'reliable data', 'datos confiables', 'after day 7', 'despues del dia 7', 'when to decide', 'cuando decidir'],
    en: "Judge trends after the Learning Phase — Day 8 onward in the sandbox — and look at several days together, not one. In real accounts, also wait for enough results (dozens of conversions, not 3) before calling a winner.",
    es: 'Juzga las tendencias después de la Fase de aprendizaje (del día 8 en adelante en el sandbox) y mira varios días juntos, no uno solo. En cuentas reales, también espera suficientes resultados (decenas de conversiones, no 3) antes de declarar una ganadora.',
    rel: ['significance', 'optimized', 'test_length'], live: LIVE.learning },
  { id: 'optimized',
    label: ['What does "Optimized" mean?', '¿Qué significa "Optimizada"?'],
    kw: ['optimized', 'optimizada', 'optimizado', 'green days', 'dias verdes', 'what does optimized mean', 'que significa optimizada'],
    en: '✅ Optimized marks Days 8–14 in the sandbox: the Learning Phase is over and delivery has settled, so this is the data to base decisions on. In real Ads Manager, the "Learning" label simply disappears once the ad set exits learning.',
    es: '✅ Optimizada marca los días 8–14 en el sandbox: terminó la Fase de aprendizaje y la entrega ya se estabilizó, así que estos son los datos para tomar decisiones. En el Administrador de anuncios real, la etiqueta "Aprendizaje" simplemente desaparece cuando el conjunto sale del aprendizaje.',
    rel: ['learning', 'when_judge'] },
]);

addTopics('metrics', [
  { id: 'ctr',
    label: ['What is CTR?', '¿Qué es el CTR?'],
    kw: ['ctr', 'click through rate', 'click-through rate', 'clickthrough', 'tasa de clics', 'porcentaje de clics'],
    en: "CTR = clicks ÷ impressions × 100. Of everyone who SAW your ad, how many CLICKED? Example: 30 clicks on 2,000 impressions = 1.5%. Around 1–2% is a common ballpark for feed ads; under ~0.5% usually means the creative isn't connecting.",
    es: 'CTR = clics ÷ impresiones × 100. De todas las personas que VIERON tu anuncio, ¿cuántas hicieron CLIC? Ejemplo: 30 clics en 2,000 impresiones = 1.5%. Entre 1% y 2% es un rango común en el feed; menos de 0.5% suele significar que el anuncio no conecta.',
    rel: ['diag_low_ctr', 'cpc', 'hook'], live: LIVE.ctr },
  { id: 'cpc',
    label: ['What is CPC?', '¿Qué es el CPC?'],
    kw: ['@cheap & @clicks', 'cpc', 'cost per click', 'costo por clic', 'price per click', 'precio por clic'],
    en: "CPC = Cost Per Click: spend ÷ clicks. Example: $30 ÷ 40 clicks = $0.75. A lower CPC usually comes from a higher CTR (more clicks from the same impressions) or a cheaper audience.",
    es: 'CPC = Costo por clic: gasto ÷ clics. Ejemplo: $30 ÷ 40 clics = $0.75. Un CPC más bajo suele venir de un CTR más alto (más clics con las mismas impresiones) o de un público más barato.',
    rel: ['cpm', 'ctr', 'cpa'], live: LIVE.cpc },
  { id: 'cpm',
    label: ['What is CPM?', '¿Qué es el CPM?'],
    kw: ['cpm', 'cost per thousand', 'cost per mille', 'cost per 1000', 'costo por mil', 'costo por 1000'],
    en: "CPM = cost per 1,000 impressions: (spend ÷ impressions) × 1,000 — the price of being seen. Example: $42 on 1,400 impressions = $30 CPM. Narrow audiences and busy seasons (like the holidays) push CPM up; in the sandbox, Sales and Leads objectives cost more per impression than Awareness.",
    es: 'CPM = costo por cada 1,000 impresiones: (gasto ÷ impresiones) × 1,000; el precio de que te vean. Ejemplo: $42 en 1,400 impresiones = CPM de $30. Los públicos limitados y las temporadas con mucha competencia (como las fiestas) suben el CPM; en el sandbox, los objetivos de Ventas y Clientes potenciales cuestan más por impresión que Reconocimiento.',
    rel: ['cpc', 'auction', 'diag_costs_rising'], live: LIVE.cpm },
  { id: 'cpa',
    label: ['What is CPA?', '¿Qué es el CPA?'],
    kw: ['cpa', 'cost per acquisition', 'costo por adquisicion', 'cost per result', 'costo por resultado', 'cost per conversion', 'costo por conversion', 'cost per lead', 'costo por cliente potencial', 'cost per sale', 'costo por venta'],
    en: "CPA = Cost Per Acquisition: spend ÷ conversions — what you pay for one result (a sale or a lead). Lower is better. The practice target here is under $25. What matters in real life is whether your CPA is below what a customer is worth to you.",
    es: 'CPA = Costo por adquisición: gasto ÷ conversiones; lo que pagas por un resultado (una venta o un cliente potencial). Más bajo es mejor. La meta de práctica aquí es menos de $25. En la vida real, lo que importa es si tu CPA está por debajo de lo que vale un cliente para ti.',
    rel: ['diag_high_cpa', 'roas', 'breakeven'], live: LIVE.cpa },
  { id: 'roas',
    label: ['What is ROAS?', '¿Qué es el ROAS?'],
    kw: ['roas', 'return on ad spend', 'retorno de la inversion publicitaria', 'retorno publicitario', 'return on spend'],
    en: "ROAS = Return On Ad Spend: revenue ÷ spend. Spend $1 and get $3 back = 3x ROAS. The practice target here is above 2.5x. Whether a ROAS is actually profitable depends on your margins — check the break-even ROAS.",
    es: 'ROAS = Retorno de la inversión publicitaria: ingresos ÷ gasto. Gastas $1 y regresan $3 = ROAS de 3x. La meta de práctica aquí es más de 2.5x. Que un ROAS sea rentable de verdad depende de tus márgenes: revisa el ROAS de equilibrio.',
    rel: ['breakeven', 'diag_low_roas', 'cpa'], live: LIVE.roas },
  { id: 'impressions',
    label: ['What are impressions?', '¿Qué son las impresiones?'],
    kw: ['impression*', 'impresion*', 'times shown', 'veces mostrado', 'veces que se mostro'],
    en: 'Impressions = the number of times your ad was shown on a screen. One person can count several times. Lots of impressions with few clicks points to a message problem; very few impressions points to a budget or audience problem.',
    es: 'Impresiones = la cantidad de veces que tu anuncio apareció en una pantalla. Una misma persona puede contar varias veces. Muchas impresiones con pocos clics apuntan a un problema de mensaje; muy pocas impresiones apuntan a un problema de presupuesto o de público.',
    rel: ['reach', 'frequency', 'diagnosis_tree'] },
  { id: 'reach',
    label: ['What is reach?', '¿Qué es el alcance?'],
    kw: ['reach & impression*', 'alcance & impresion*', 'reach', 'alcance', 'unique people', 'personas unicas', 'reach vs impressions', 'alcance vs impresiones', 'how many people saw', 'cuantas personas vieron'],
    en: 'Reach = how many different people saw your ad. Impressions count every view; reach counts each person once. Impressions ÷ reach = frequency (how many times the average person saw it).',
    es: 'Alcance = cuántas personas diferentes vieron tu anuncio. Las impresiones cuentan cada vista; el alcance cuenta a cada persona una sola vez. Impresiones ÷ alcance = frecuencia (cuántas veces lo vio la persona promedio).',
    rel: ['frequency', 'impressions'] },
  { id: 'frequency',
    label: ['What is frequency?', '¿Qué es la frecuencia?'],
    kw: ['frequency', 'frecuencia', 'how many times', 'cuantas veces', 'saw my ad too many times', 'vieron mi anuncio muchas veces'],
    en: "Frequency = impressions ÷ reach: the average number of times each person saw your ad. As a rough rule of thumb, under ~3 is usually healthy for cold audiences; when it climbs higher, CTR drops and costs rise — ad fatigue. In the sandbox, watch the Freq. column: fatigue starts around 2, and past 3 you'll see the ♻️ Refresh verdict. Small audiences hit it fastest.",
    es: "Frecuencia = impresiones ÷ alcance: el número promedio de veces que cada persona vio tu anuncio. Como regla aproximada, menos de ~3 suele estar bien para públicos fríos; cuando sube más, el CTR baja y los costos suben: fatiga publicitaria. En el sandbox, mira la columna Frec.: la fatiga empieza cerca de 2 y pasando 3 verás el veredicto ♻️ Renovar. Los públicos pequeños llegan ahí más rápido.",
    rel: ['creative_fatigue', 'reach', 'diag_costs_rising'], live: LIVE.freq },
  { id: 'clicks',
    label: ['What counts as a click?', '¿Qué cuenta como clic?'],
    kw: ['clicks', 'clics', 'link clicks', 'clics en el enlace', 'all clicks', 'todos los clics', 'what counts as a click', 'que cuenta como clic'],
    en: 'Link clicks = taps that go to your website or form — the ones that matter. "All clicks" also counts likes, profile taps, and "See more," so it looks bigger than it really is. Use link clicks for CTR and CPC.',
    es: 'Clics en el enlace = toques que llevan a tu sitio web o formulario: los que importan. "Todos los clics" también cuenta me gusta, toques al perfil y "Ver más", así que se ve más grande de lo que es. Usa clics en el enlace para el CTR y el CPC.',
    rel: ['ctr', 'cpc'] },
  { id: 'conversion',
    label: ['What is a conversion?', '¿Qué es una conversión?'],
    kw: ['conversion', 'what is a conversion', 'que es una conversion', 'results column', 'columna de resultados', 'what is a result', 'que es un resultado'],
    en: 'A conversion is the action you actually want — a purchase, a lead form, a sign-up. In Ads Manager it shows in the Results column, matched to your objective. Conversions only count if they\'re tracked (that\'s the Pixel\'s job).',
    es: 'Una conversión es la acción que de verdad quieres: una compra, un formulario, un registro. En el Administrador de anuncios aparece en la columna Resultados, según tu objetivo. Las conversiones solo cuentan si se miden (ese es el trabajo del Píxel).',
    rel: ['cpa', 'conversion_rate', 'pixel'] },
  { id: 'conversion_rate',
    label: ['What is conversion rate?', '¿Qué es la tasa de conversión?'],
    kw: ['conversion rate', 'tasa de conversion', 'cvr', 'how many clicks buy', 'cuantos clics compran', 'percent who buy', 'porcentaje que compra'],
    en: "Conversion rate = conversions ÷ clicks × 100: of the people who clicked, how many took the action? It mostly reflects your landing page and offer. In the sandbox, Sales converts around 4% of clicks and Leads around 6% once out of learning.",
    es: "Tasa de conversión = conversiones ÷ clics × 100: de las personas que hicieron clic, ¿cuántas hicieron la acción? Refleja sobre todo tu página de destino y tu oferta. En el sandbox, Ventas convierte cerca del 4% de los clics y Clientes potenciales cerca del 6% después del aprendizaje.",
    rel: ['landing_page', 'diag_clicks_no_sales', 'offer'] },
  { id: 'aov_revenue',
    label: ['What is AOV (average order value)?', '¿Qué es el valor promedio del pedido?'],
    kw: ['aov', 'average order value', 'valor promedio del pedido', 'ticket promedio', 'revenue', 'ingresos', 'purchase value', 'valor de compra', 'order value'],
    en: 'AOV = revenue ÷ number of orders. In the sandbox every conversion is worth $45. A higher AOV lets you afford a higher CPA — bundles and upsells raise AOV without touching your ads.',
    es: 'Valor promedio del pedido = ingresos ÷ número de pedidos. En el sandbox cada conversión vale $45. Un valor promedio más alto te permite pagar un CPA más alto: los paquetes y las ventas adicionales lo suben sin tocar tus anuncios.',
    rel: ['breakeven', 'roas', 'offer'] },
  { id: 'breakeven',
    label: ['What ROAS do I need to profit?', '¿Qué ROAS necesito para ganar?'],
    kw: ['break even', 'breakeven', 'punto de equilibrio', 'profit margin', 'margen de ganancia', 'margen', 'profitable', 'rentable', 'profit', 'ganancia*', 'making money', 'ganando dinero', 'roas do i need', 'roas necesito'],
    en: "Break-even ROAS = 1 ÷ profit margin. With a 40% margin you need 2.5x just to break even (1 ÷ 0.40); with a 25% margin, 4x. In this sandbox, products have a 60% margin, so break-even is 1.67x — the line between 🔵 Keep and 🔴 Kill. Below break-even you lose money on every sale, even if sales are coming in.",
    es: "ROAS de equilibrio = 1 ÷ margen de ganancia. Con un margen de 40% necesitas 2.5x solo para no perder (1 ÷ 0.40); con un margen de 25%, 4x. En este sandbox, los productos tienen un margen de 60%, así que el equilibrio está en 1.67x: la línea entre 🔵 Mantener y 🔴 Apagar. Por debajo del equilibrio pierdes dinero en cada venta, aunque sí estén llegando ventas.",
    rel: ['roas', 'aov_revenue', 'ltv'], live: LIVE.roas },
  { id: 'benchmarks',
    label: ['What are good numbers?', '¿Cuáles son buenos números?'],
    kw: ['benchmark*', 'good numbers', 'buenos numeros', 'what is good', 'que es bueno', 'good ctr', 'buen ctr', 'good cpa', 'buen cpa', 'good roas', 'buen roas', 'average ctr', 'ctr promedio', 'normal numbers', 'numeros normales'],
    en: "Practice targets in this sandbox: CTR ~1–2% (under 0.5% = creative problem), CPA under $25, ROAS above 2.5x to scale (break-even is 1.67x), frequency under ~3. Real benchmarks vary by industry, price, and season — the number that truly matters is your break-even.",
    es: "Metas de práctica en este sandbox: CTR de ~1–2% (menos de 0.5% = problema del anuncio), CPA menor a $25, ROAS mayor a 2.5x para escalar (el equilibrio está en 1.67x) y frecuencia menor a ~3. Los valores reales cambian según la industria, el precio y la temporada; el número que de verdad importa es tu punto de equilibrio.",
    rel: ['breakeven', 'ctr', 'which_metric'] },
  { id: 'formulas',
    label: ['Show me all the formulas', 'Muéstrame todas las fórmulas'],
    kw: ['formula*', 'formulas', 'how to calculate', 'como calcular', 'calcul*', 'math', 'matematica*', 'cheat sheet', 'hoja de referencia'],
    en: "CTR = clicks ÷ impressions × 100\nCPC = spend ÷ clicks\nCPM = spend ÷ impressions × 1,000\nCPA = spend ÷ conversions\nROAS = revenue ÷ spend\nFrequency = impressions ÷ reach\nConversion rate = conversions ÷ clicks × 100\nBreak-even ROAS = 1 ÷ profit margin",
    es: 'CTR = clics ÷ impresiones × 100\nCPC = gasto ÷ clics\nCPM = gasto ÷ impresiones × 1,000\nCPA = gasto ÷ conversiones\nROAS = ingresos ÷ gasto\nFrecuencia = impresiones ÷ alcance\nTasa de conversión = conversiones ÷ clics × 100\nROAS de equilibrio = 1 ÷ margen de ganancia',
    rel: ['ctr', 'cpa', 'breakeven'] },
  { id: 'which_metric',
    label: ['Which metric matters most?', '¿Qué métrica importa más?'],
    kw: ['most important metric', 'metrica mas importante', 'which metric', 'que metrica', 'what to look at', 'que mirar', 'what numbers matter', 'que numeros importan', 'main kpi', 'kpi principal'],
    en: "The one tied to the business goal. For Sales: CPA and ROAS. For Leads: cost per lead and lead quality. For Traffic: CPC and landing-page behavior. CTR and CPM are diagnostic — they explain WHY the main number moved.",
    es: 'La que está ligada a la meta del negocio. Para Ventas: CPA y ROAS. Para Clientes potenciales: costo por cliente y calidad del cliente. Para Tráfico: CPC y lo que pasa en la página de destino. El CTR y el CPM son de diagnóstico: explican POR QUÉ se movió el número principal.',
    rel: ['diagnosis_tree', 'benchmarks', 'vanity'] },
  { id: 'vanity',
    label: ['Are likes and views worth it?', '¿Valen la pena los me gusta y las vistas?'],
    kw: ['like* & nobody buy*', 'like* & no sale*', 'like* & no one buy*', 'me gusta & nadie compra', 'me gusta & sin ventas', 'vanity metric*', 'metrica* de vanidad', 'likes vs sales', 'me gusta vs ventas', 'are likes worth', 'valen la pena los me gusta', 'views worth', 'vistas valen'],
    en: "Likes, views, and followers are \"vanity metrics\" when they don't lead to the business goal. They can help (social proof, retargeting pools), but a client paying for sales cares about CPA and ROAS. Report vanity metrics as supporting detail, never as the headline.",
    es: 'Los me gusta, las vistas y los seguidores son "métricas de vanidad" cuando no llevan a la meta del negocio. Pueden ayudar (prueba social, públicos para retargeting), pero un cliente que paga por ventas se fija en el CPA y el ROAS. Repórtalas como detalle de apoyo, nunca como el resultado principal.',
    rel: ['which_metric', 'obj_engagement'] },
  { id: 'ltv',
    label: ['What is customer lifetime value?', '¿Qué es el valor de vida del cliente?'],
    kw: ['ltv', 'lifetime value', 'valor de vida', 'clv', 'repeat customer*', 'clientes recurrentes', 'customer value', 'valor del cliente'],
    en: "LTV = the total profit a customer brings over time, not just the first order. If people reorder, you can afford a higher CPA on the first sale. Be careful: only use LTV if you have real repeat-purchase data to back it up.",
    es: 'El valor de vida del cliente (LTV) = la ganancia total que un cliente deja con el tiempo, no solo en el primer pedido. Si la gente vuelve a comprar, puedes pagar un CPA más alto en la primera venta. Cuidado: usa el LTV solo si tienes datos reales de compras repetidas que lo respalden.',
    rel: ['breakeven', 'cpa'] },
]);

addTopics('diagnose', [
  { id: 'diagnosis_tree',
    label: ["My ad isn't working — what's wrong?", 'Mi anuncio no funciona, ¿qué está mal?'],
    kw: ['got nothing', 'no results', 'sin resultados', 'nothing happen*', 'no pasa nada', 'wasted money', 'waste* & money', 'tire* & dinero', 'perdi & dinero', 'spent & nothing', 'gast* & nada', 'getting nothing', 'no me funciona', 'doesnt work', 'didnt work', 'no funciono', 'not selling', 'no vend*', 'no despeg*', 'low sales', 'pocas ventas', 'ventas bajas', 'sales are low', 'not taking off', 'sales are slow', 'ventas lentas', 'isnt working', 'whats wrong', 'no funciona & anuncio', 'diagnos*', 'whats wrong', 'que esta mal', 'not working', 'no funciona', 'ad isnt working', 'mi anuncio no funciona', 'troubleshoot', 'fix my campaign', 'arreglar mi campana', 'bad results', 'malos resultados', 'why is my ad', 'por que mi anuncio'],
    en: "Walk the funnel top to bottom:\n1) Few impressions? → budget or audience problem.\n2) Lots of impressions, low CTR? → message/creative problem.\n3) Good CTR, few conversions? → landing page or offer problem.\n4) Conversions but CPA too high? → audience cost or offer value.\nFix ONE thing at a time, then re-test.",
    es: 'Revisa el embudo de arriba hacia abajo:\n1) ¿Pocas impresiones? → problema de presupuesto o de público.\n2) ¿Muchas impresiones y CTR bajo? → problema de mensaje o de anuncio.\n3) ¿Buen CTR y pocas conversiones? → problema de página de destino o de oferta.\n4) ¿Hay conversiones pero el CPA es muy alto? → costo del público o valor de la oferta.\nArregla UNA cosa a la vez y vuelve a probar.',
    rel: ['diag_low_ctr', 'diag_clicks_no_sales', 'diag_high_cpa'] },
  { id: 'diag_low_ctr',
    label: ['Why is my CTR low?', '¿Por qué mi CTR está bajo?'],
    kw: ['@clicks & @problem', '@see & @clicks & @problem', 'more clicks', 'mas clics', 'get clicks', 'conseguir clics', 'ctr & low', 'ctr & bajo', 'ctr & bad', 'ctr & malo', 'ctr & poor', 'ctr & improve', 'ctr & mejorar', 'low ctr', 'ctr bajo', 'ctr is low', 'ctr esta bajo', 'no clicks', 'sin clics', 'nobody clicks', 'nadie hace clic', 'nadie da clic', 'views but no clicks', 'vistas pero no clics', 'lots of impressions few clicks', 'muchas impresiones pocos clics'],
    en: "Low CTR (under ~0.5–1%) means the ad isn't stopping the scroll or giving a reason to click. Test, one at a time: a sharper hook in the first 3 words, a clearer benefit, a stronger image, or a better-matched audience. In the sandbox, specific copy (a number, an offer, \"you\") gets a click boost, and if frequency is high, a fresh creative resets fatigue.",
    es: "Un CTR bajo (menos de ~0.5–1%) significa que el anuncio no detiene el scroll o no da una razón para hacer clic. Prueba, de una en una: un gancho más fuerte en las primeras 3 palabras, un beneficio más claro, una imagen más llamativa o un público que encaje mejor. En el sandbox, un texto específico (un número, una oferta, hablarle a \"ti\") recibe un impulso de clics, y si la frecuencia está alta, un anuncio nuevo reinicia la fatiga.",
    rel: ['hook', 'creative_test', 'angles'], live: LIVE.ctr },
  { id: 'diag_low_impressions',
    label: ['Why is my ad barely showing?', '¿Por qué casi no se muestra mi anuncio?'],

addTopics('testing', [

  { id: 'one_variable',

  { id: 'what_to_test',

  { id: 'test_length',

  { id: 'significance',
    label: ['Is my winner real or just luck?', '¿Mi ganadora es real o pura suerte?'],

  { id: 'creative_test',

addTopics('scaling', [

  { id: 'creative',
    label: ['How do I write a good ad?', '¿Cómo escribo un buen anuncio?'],
    kw: ['what to write', 'que escribir', 'dont know & write', 'no se & escribir', 'help & write', 'ayuda & escribir', 'ideas & ad', 'ideas para & anuncio', 'stuck & copy', 'bloque* & escribir', 'good ad', 'buen anuncio', 'write an ad', 'escribir un anuncio', 'ad copy', 'texto del anuncio', 'copywriting', 'copy tips', 'consejos de texto', 'creative tips', 'consejos creativos', 'better ad', 'mejor anuncio'],
    en: "Strong ads: 1) hook in the first 3 words, 2) one specific benefit (not \"great product\"), 3) proof (a number, review, or demo), 4) a clear call to action, all aimed at one audience's real problem. Then test 2–3 different angles and let the data choose.",
    es: 'Un buen anuncio: 1) gancho en las primeras 3 palabras, 2) un beneficio específico (no "gran producto"), 3) una prueba (un número, una reseña o una demostración), 4) una llamada a la acción clara, todo apuntado al problema real de un público. Luego prueba 2–3 ángulos distintos y deja que los datos elijan.',
    rel: ['hook_value_cta', 'angles', 'creative_test'] },
  { id: 'hook_value_cta',
    label: ['The hook-value-CTA formula', 'La fórmula gancho-valor-acción'],
    kw: ['hook value cta', 'gancho valor', 'hook-value-cta', '3 part formula', 'formula de 3 partes', 'formula for an ad', 'formula para un anuncio', 'copy structure', 'estructura del texto'],
    en: "1) Hook — stop the scroll (\"Orlando pups go crazy for these\").\n2) Value — what's in it for them (\"5 ingredients, zero junk, baked fresh weekly\").\n3) CTA — tell them what to do (\"Order this week — first bag ships free\").\nLabel all three in every ad you write.",
    es: '1) Gancho: detiene el scroll ("Los perritos de Orlando las aman").\n2) Valor: qué ganan ellos ("5 ingredientes, cero basura, horneadas cada semana").\n3) Llamada a la acción: diles qué hacer ("Pide esta semana: la primera bolsa va con envío gratis").\nIdentifica las tres partes en cada anuncio que escribas.',
    rel: ['hook', 'cta', 'creative'] },
  { id: 'hook',
    label: ['How do I write a hook?', '¿Cómo escribo un gancho?'],
    kw: ['hook*', 'gancho*', 'stop the scroll', 'detener el scroll', 'scroll stopper', 'grab attention', 'llamar la atencion', 'first line', 'primera linea', 'opening line'],
    en: "A hook earns the next second of attention. Starters that work: \"Tired of…?\", \"What if…\", \"POV:\", \"Stop doing X\", a surprising number (\"10 minutes a day\"), or showing the result first. Speak to one person's problem, not \"everyone.\"",
    es: 'Un gancho se gana el siguiente segundo de atención. Inicios que funcionan: "¿Te cansaste de…?", "¿Y si…?", "POV:", "Deja de hacer X", un número sorprendente ("10 minutos al día") o mostrar primero el resultado. Háblale al problema de una persona, no a "todo el mundo".',
    rel: ['hook_value_cta', 'video_ads', 'persona'] },
  { id: 'headline_tips',
    label: ['Tips for headlines', 'Consejos para títulos'],
    kw: ['headline*', 'titulo*', 'good headline', 'buen titulo', 'headline length', 'largo del titulo', 'write a headline', 'escribir un titulo'],
    en: "Headlines sit under the image — keep them short (the sandbox allows 40 characters) and specific: a benefit or offer beats a brand slogan. \"Plan your week in 5 minutes\" beats \"The best planner.\" Test 2 headline versions against each other.",
    es: 'El título va debajo de la imagen: que sea corto (el sandbox permite 40 caracteres) y específico; un beneficio u oferta le gana a un eslogan de marca. "Planea tu semana en 5 minutos" le gana a "La mejor agenda". Prueba 2 versiones de título una contra otra.',
    rel: ['creative_test', 'primary_text', 'ad_parts'] },
  { id: 'primary_text',
    label: ['Tips for primary text', 'Consejos para el texto principal'],
    kw: ['primary text', 'texto principal', 'body text', 'cuerpo del anuncio', 'caption', 'long copy', 'short copy', 'texto largo', 'texto corto', 'see more', 'ver mas'],
    en: "Primary text sits above the image, and only the first ~125 characters show before \"See more\" — so lead with the hook and the benefit. Short copy works for simple offers; longer copy can win for higher-priced products that need more convincing. Test both.",
    es: 'El texto principal va arriba de la imagen y solo se ven los primeros ~125 caracteres antes de "Ver más", así que empieza con el gancho y el beneficio. El texto corto funciona para ofertas simples; el largo puede ganar en productos más caros que necesitan convencer más. Prueba los dos.',
    rel: ['hook', 'headline_tips'] },
  { id: 'cta',
    label: ['Which call-to-action button should I use?', '¿Qué botón de llamada a la acción uso?'],
    kw: ['cta', 'call to action', 'llamada a la accion', 'button', 'boton', 'shop now', 'learn more', 'mas informacion', 'sign up', 'which cta', 'que boton'],
    en: "Match the button to the next step: Shop Now for ready-to-buy products, Learn More for products that need explaining, Sign Up for lists or trials, Get Offer for promotions, Book Now for appointments. Say the same action in your text.",
    es: 'Haz que el botón coincida con el siguiente paso: Comprar para productos listos para vender, Más información para productos que necesitan explicación, Registrarte para listas o pruebas, Obtener oferta para promociones, Reservar para citas. Repite la misma acción en tu texto.',
    rel: ['hook_value_cta', 'offer'] },
  { id: 'angles',
    label: ['What creative angles can I test?', '¿Qué ángulos creativos puedo probar?'],
    kw: ['angle*', 'angulo*', 'direct offer', 'oferta directa', 'curiosity', 'curiosidad', 'benefit-focused', 'beneficio*', 'problem solution', 'problema solucion', 'testimonial*', 'testimonio*'],
    en: "Classic angles to test against each other:\n• Direct offer — \"Save 30% on your first order.\"\n• Curiosity/question — \"Still guessing what ads work?\"\n• Benefit — \"Launch better ads with less risk.\"\n• Problem → solution — name the pain, show the fix.\n• Testimonial — a real customer's words (with permission).",
    es: 'Ángulos clásicos para probar entre sí:\n• Oferta directa: "Ahorra 30% en tu primer pedido".\n• Curiosidad o pregunta: "¿Sigues adivinando qué anuncios funcionan?".\n• Beneficio: "Lanza mejores anuncios con menos riesgo".\n• Problema → solución: nombra el dolor y muestra la solución.\n• Testimonio: las palabras de un cliente real (con permiso).',
    rel: ['creative_test', 'social_proof', 'offer'] },
  { id: 'ugc',
    label: ['What is UGC?', '¿Qué es el UGC?'],
    kw: ['look native', 'less like an ad', 'less like ads', 'parezca menos anuncio', 'native looking', 'natural', 'ugc', 'user generated', 'contenido generado por usuarios', 'creator content', 'contenido de creadores', 'influencer content', 'creators', 'creadores'],
    en: "UGC (user-generated content) is a real customer or creator talking about the product, usually on a phone camera. It looks native in Feed and Reels and builds trust fast. If you pay a creator, the partnership must be disclosed, and you need permission to use anyone's content in ads.",
    es: 'El UGC (contenido generado por usuarios) es un cliente o creador real hablando del producto, normalmente grabado con el celular. Se ve natural en el Feed y en Reels y genera confianza rápido. Si le pagas a un creador, la colaboración debe declararse, y necesitas permiso para usar el contenido de cualquier persona en anuncios.',
    rel: ['disclosure', 'social_proof', 'reels'] },
  { id: 'social_proof',
    label: ['How do I use social proof?', '¿Cómo uso la prueba social?'],
    kw: ['social proof', 'prueba social', 'reviews', 'resenas', 'customer quote', 'cita de un cliente', 'stars', 'estrellas', 'build trust', 'generar confianza'],
    en: "Social proof = evidence other people trust you: reviews, star ratings, \"50,000 members,\" customer quotes, before/after results. It works best for warm audiences and higher prices. Rule: it must be real, and quotes need the customer's permission.",
    es: 'Prueba social = evidencia de que otras personas confían en ti: reseñas, calificaciones con estrellas, "50,000 miembros", citas de clientes, resultados de antes y después. Funciona mejor con públicos cálidos y precios más altos. Regla: tiene que ser real, y las citas necesitan el permiso del cliente.',
    rel: ['angles', 'ftc_truth', 'retargeting'] },
  { id: 'offer',
    label: ['What makes a good offer?', '¿Qué hace buena una oferta?'],
    kw: ['offer', 'oferta', 'discount', 'descuento', 'free shipping', 'envio gratis', 'bundle', 'paquete', 'promo*', 'coupon', 'cupon'],
    en: "A good offer makes saying yes easy: a clear deal (\"first bag ships free\"), a bundle (\"buy 3, save 20%\"), a guarantee you can honor, or a low-risk first step (free trial, quiz, sample). Often a better offer beats a better ad.",
    es: 'Una buena oferta hace fácil decir que sí: un trato claro ("la primera bolsa va con envío gratis"), un paquete ("lleva 3 y ahorra 20%"), una garantía que sí puedas cumplir o un primer paso de bajo riesgo (prueba gratis, quiz, muestra). Muchas veces una mejor oferta le gana a un mejor anuncio.',
    rel: ['urgency', 'aov_revenue', 'angles'] },
  { id: 'urgency',
    label: ['Is urgency OK in ads?', '¿Está bien usar urgencia?'],
    kw: ['urgency', 'urgencia', 'scarcity', 'escasez', 'limited time', 'tiempo limitado', 'countdown', 'cuenta regresiva', 'fake urgency', 'urgencia falsa', 'sale ends', 'la venta termina'],
    en: "Honest urgency is fine — \"Sale ends Sunday\" when it really ends Sunday. Fake urgency (a countdown that resets, \"only 2 left\" when there are 200) is deceptive and can break FTC rules. If it isn't true, don't say it.",
    es: 'La urgencia honesta está bien: "La venta termina el domingo" cuando de verdad termina el domingo. La urgencia falsa (un contador que se reinicia, "solo quedan 2" cuando hay 200) es engañosa y puede violar las reglas de la FTC. Si no es verdad, no lo digas.',
    rel: ['ftc_truth', 'offer'] },
  { id: 'voice_match',
    label: ['How do I match my audience\'s voice?', '¿Cómo hablo como mi público?'],
    kw: ['tone', 'tono', 'brand voice', 'voz de marca', 'speak to my audience', 'hablarle a mi publico', 'match my audience', 'different audiences', 'publicos diferentes', 'how to talk to'],
    en: "Copy for a new mom sounds different from copy for college students. Use the words your audience uses (read reviews and comments), mention their real situation, and keep one persona in mind per ad. Same product, different voice, often very different CTR.",
    es: 'El texto para una mamá primeriza suena distinto al texto para universitarios. Usa las palabras que usa tu público (lee reseñas y comentarios), menciona su situación real y piensa en un solo buyer persona por anuncio. Mismo producto, otra voz y muchas veces un CTR muy distinto.',
    rel: ['persona', 'hook'] },
  { id: 'landing_page',
    label: ['Why does the landing page matter?', '¿Por qué importa la página de destino?'],
    kw: ['landing page', 'pagina de destino', 'after the click', 'despues del clic', 'product page', 'pagina de producto', 'checkout', 'slow website', 'sitio lento', 'website conversion'],
    en: "The ad gets the click; the landing page gets the sale. It should match the ad's promise, load fast on a phone, show the price and offer clearly, and make the next step obvious. A weak page can make a great ad look like a failure.",
    es: 'El anuncio consigue el clic; la página de destino consigue la venta. Debe cumplir lo que promete el anuncio, cargar rápido en el celular, mostrar claro el precio y la oferta y hacer obvio el siguiente paso. Una página débil puede hacer que un gran anuncio parezca un fracaso.',
    rel: ['diag_clicks_no_sales', 'conversion_rate', 'utm'] },
  { id: 'visuals',
    label: ['What makes a good ad image?', '¿Qué hace buena una imagen de anuncio?'],
    kw: ['image', 'imagen', 'photo*', 'foto*', 'visual*', 'design', 'diseno', 'canva', 'what image', 'que imagen', 'text on image', 'texto en la imagen', 'faces', 'caras', 'thumbnail', 'miniatura'],
    en: "Make it readable at phone size: one clear subject, high contrast, real people or the product in use, and little text on the image. Show the result or the moment of use. Bright, native-looking photos often beat polished studio shots.",
    es: 'Que se entienda en el tamaño de un celular: un solo protagonista claro, buen contraste, personas reales o el producto en uso, y poco texto sobre la imagen. Muestra el resultado o el momento de uso. Las fotos naturales y luminosas muchas veces le ganan a las fotos de estudio muy producidas.',
    rel: ['specs', 'copyright_music', 'creative_test'] },
]);

addTopics('rules', [
  { id: 'ftc_truth',
    label: ['What does truth in advertising mean?', '¿Qué es la publicidad veraz?'],
    kw: ['ftc', 'truth in advertising', 'publicidad veraz', 'honest ad*', 'anuncio honesto', 'claims', 'afirmaciones', 'false advertising', 'publicidad enganosa', 'misleading', 'enganos*', 'lie in an ad', 'mentir en un anuncio'],
    en: "In the US, the FTC requires ads to be truthful and claims to be backed by evidence. No fake reviews, no invented results, no \"doctors hate this.\" Fines and lawsuits are real — practice like it's real: if you can't prove it, don't claim it.",
    es: 'En EE. UU., la FTC exige que los anuncios sean veraces y que las afirmaciones estén respaldadas con evidencia. Nada de reseñas falsas, resultados inventados ni "los doctores odian esto". Las multas y las demandas son reales; practica como si fuera real: si no lo puedes probar, no lo afirmes.',
    rel: ['health_finance_claims', 'disclosure', 'compliance_checklist'] },
  { id: 'disclosure',
    label: ['When do I need to disclose (#ad)?', '¿Cuándo debo declarar publicidad (#ad)?'],
    kw: ['disclos*', 'hashtag ad', 'divulgac*', 'declarar publicidad', 'paid partnership', 'colaboracion pagada', 'affiliate*', 'afiliado*', 'influencer post', 'sponsored post', 'publicacion patrocinada', 'influencer skips'],
    en: "Whenever there's a paid or material relationship — a paid influencer, free product, or affiliate commission — it must be clearly disclosed (\"#ad,\" \"Paid partnership\"). Hiding the relationship is the violation. An influencer who skips #ad: violation.",
    es: 'Siempre que haya una relación pagada o de interés (un influencer pagado, producto gratis o comisión de afiliado) debe declararse claramente ("#ad", "Colaboración pagada"). Ocultar la relación es la infracción. Un influencer que no pone #ad: infracción.',
    rel: ['ugc', 'ftc_truth'] },
  { id: 'special_categories',
    label: ['Housing, job & credit ads', 'Anuncios de vivienda, empleo y crédito'],
    kw: ['special ad categor*', 'categoria especial', 'categorias especiales', 'housing', 'vivienda', 'employment', 'job ad*', 'anuncio de empleo', 'anuncios de empleo', 'credit ad*', 'anuncios de credito', 'financial products', 'productos financieros', 'discriminat*', 'discrimina*', 'only men', 'solo hombres', 'only women', 'solo mujeres'],
    en: "Housing, employment, and credit/financial-product ads are Special Ad Categories with anti-discrimination limits: no targeting by age, gender, or ZIP code, and narrower targeting options. A job ad aimed only at men 20–30 is a violation. Political and social-issue ads have their own authorization rules. Meta updates these policies, so check the current version.",
    es: 'Los anuncios de vivienda, empleo y crédito/productos financieros son Categorías especiales con límites contra la discriminación: no se puede segmentar por edad, género ni código postal, y hay menos opciones de segmentación. Un anuncio de empleo dirigido solo a hombres de 20–30 años es una infracción. Los anuncios políticos y de temas sociales tienen sus propias reglas de autorización. Meta actualiza estas políticas, así que revisa la versión actual.',
    rel: ['three_levers', 'ad_rejected', 'compliance_checklist'] },
  { id: 'health_finance_claims',
    label: ['Health & money claims', 'Afirmaciones de salud y dinero'],
    kw: ['health claim*', 'afirmacion* de salud', 'cure*', 'cura*', 'weight loss', 'bajar de peso', 'perder peso', 'supplement*', 'suplemento*', 'guaranteed return*', 'retornos garantizados', 'get rich', 'hacerse rico', 'medical claim*', 'reclamos medicos'],
    en: "Health and money claims get extra scrutiny. \"This supplement cures anxiety\" = violation (unproven health claim). \"Guaranteed 20% returns\" = violation (deceptive guarantee). Also avoid \"before/after\" body shaming and personal-attribute phrasing like \"Are you overweight?\" — Meta rejects those.",
    es: 'Las afirmaciones de salud y dinero tienen revisión extra. "Este suplemento cura la ansiedad" = infracción (afirmación de salud sin pruebas). "Retornos garantizados de 20%" = infracción (garantía engañosa). También evita los "antes y después" que avergüenzan el cuerpo y frases sobre atributos personales como "¿Tienes sobrepeso?": Meta las rechaza.',
    rel: ['ftc_truth', 'ad_rejected', 'guarantees'] },
  { id: 'privacy',
    label: ['What about privacy?', '¿Y la privacidad?'],
    kw: ['privacy', 'privacidad', 'creepy', 'personal data', 'datos personales', 'tracking people', 'rastrear personas', 'cookies', 'ios', 'app tracking', 'apple privacy'],
    en: "Collect and use data transparently, with a clear privacy policy. \"Creepy\" ads that mention someone's private situation erode trust even when technically allowed. Since Apple's iOS privacy changes, tracking is less complete — which is one reason the Conversions API exists.",
    es: 'Recoge y usa datos con transparencia y con una política de privacidad clara. Los anuncios "invasivos" que mencionan la situación privada de alguien dañan la confianza aunque técnicamente estén permitidos. Desde los cambios de privacidad de iOS de Apple, la medición es menos completa; esa es una razón por la que existe la API de conversiones.',
    rel: ['pixel', 'special_categories'] },
  { id: 'ad_rejected',
    label: ['Why was my ad rejected?', '¿Por qué rechazaron mi anuncio?'],
    kw: ['rechaz*', 'reject*', 'disapprov*', 'rejected', 'rechazad*', 'disapproved', 'no aprobado', 'ad review', 'revision del anuncio', 'policy', 'politica*', 'banned', 'bloquead*', 'restricted account', 'cuenta restringida', 'in review', 'en revision'],
    en: "Real ads go through review (usually within a day). Common rejections: misleading claims, personal-attribute language (\"Are you in debt?\"), restricted products, broken landing pages, or targeting that breaks Special Ad Category rules. Read the reason, fix that one thing, and request another review. (The sandbox skips review.)",
    es: 'Los anuncios reales pasan por revisión (normalmente en menos de un día). Rechazos comunes: afirmaciones engañosas, frases sobre atributos personales ("¿Tienes deudas?"), productos restringidos, páginas de destino que no funcionan o segmentación que rompe las reglas de Categorías especiales. Lee el motivo, corrige esa cosa y pide otra revisión. (El sandbox se salta la revisión).',
    rel: ['health_finance_claims', 'special_categories', 'compliance_checklist'] },
  { id: 'copying',
    label: ['Can I copy a competitor\'s ad?', '¿Puedo copiar el anuncio de la competencia?'],
    kw: ['copy & competitor*', 'copi* & competencia', 'copiar & anuncio', 'copy & their ad', 'copy a competitor', 'copy competitor', 'copiar a la competencia', 'copy an ad', 'copiar un anuncio', 'steal', 'robar', 'plagi*'],
    en: "No. Study patterns — the hook style, the offer type, the format — then make your own version. Copying another brand's ad is unethical, can infringe copyright or trademarks, and makes your ads feel stale anyway.",
    es: 'No. Estudia los patrones (el estilo del gancho, el tipo de oferta, el formato) y luego haz tu propia versión. Copiar el anuncio de otra marca no es ético, puede violar derechos de autor o marcas registradas y, además, hace que tus anuncios se sientan gastados.',
    rel: ['adlibrary', 'copyright_music'] },
  { id: 'compliance_checklist',
    label: ['Is my ad compliant? (checklist)', '¿Mi anuncio cumple las reglas? (lista)'],
    kw: ['compliance', 'cumplimiento', 'compliant', 'checklist', 'lista de verificacion', 'audit my ad', 'auditar mi anuncio', 'is my ad allowed', 'mi anuncio esta permitido', 'is this allowed', 'esta permitido'],
    en: "Run the 4-point check before launch:\n1) Honest claims you can prove.\n2) No fake urgency.\n3) A clear offer — no hidden catch.\n4) Fair, appropriate targeting (Special Ad Category rules followed).\nPlus: paid relationships disclosed and customer quotes used with permission.",
    es: 'Haz esta revisión de 4 puntos antes de lanzar:\n1) Afirmaciones honestas que puedas probar.\n2) Nada de urgencia falsa.\n3) Una oferta clara, sin trampas escondidas.\n4) Segmentación justa y apropiada (reglas de Categorías especiales cumplidas).\nAdemás: relaciones pagadas declaradas y citas de clientes usadas con permiso.',
    rel: ['ftc_truth', 'disclosure', 'special_categories'] },
  { id: 'guarantees',
    label: ['Can I guarantee results?', '¿Puedo garantizar resultados?'],
    kw: ['guarantee*', 'garantiz*', 'garantia', 'promise results', 'prometer resultados', 'guaranteed sales', 'ventas garantizadas'],
    en: "In ads: only guarantee what you'll actually honor (\"30-day money-back\") — never guaranteed income or returns. With clients: never promise specific results; nobody controls the auction. Promise your process instead: how you'll test, report, and improve.",
    es: 'En anuncios: solo garantiza lo que de verdad vas a cumplir ("devolución en 30 días"), nunca ingresos ni retornos garantizados. Con clientes: nunca prometas resultados específicos; nadie controla la subasta. Mejor promete tu proceso: cómo vas a probar, reportar y mejorar.',
    rel: ['health_finance_claims', 'freelance', 'client_questions'] },
  { id: 'copyright_music',
    label: ['Can I use any image or song?', '¿Puedo usar cualquier imagen o canción?'],
    kw: ['copyright', 'derechos de autor', 'music', 'musica', 'song', 'cancion', 'stock photo*', 'fotos de stock', 'images from google', 'imagenes de google', 'royalty free', 'libre de regalias'],
    en: "No — use your own photos, licensed stock, or content you have written permission to use. Popular songs usually aren't licensed for ads; use royalty-free music or Meta's Sound Collection. Ads using unlicensed content can be removed.",
    es: 'No: usa tus propias fotos, fotos de stock con licencia o contenido que tengas permiso por escrito para usar. Las canciones populares normalmente no tienen licencia para anuncios; usa música libre de regalías o la Sound Collection de Meta. Los anuncios con contenido sin licencia pueden ser eliminados.',
    rel: ['visuals', 'copying', 'ugc'] },
]);

addTopics('tools', [
  { id: 'bulk',
    label: ['What is Bulk upload?', '¿Qué es la Carga masiva?'],
    kw: ['bulk', 'bulk upload', 'carga masiva', 'masiva', 'upload a spreadsheet', 'subir una hoja', 'csv', 'many campaigns at once', 'muchas campanas a la vez'],
    en: "Bulk upload launches many campaigns from one spreadsheet — one row per campaign. Click 📤 Bulk upload, paste the sample, and launch. Pros use it to launch 20 ads in seconds instead of clicking through each one.",
    es: 'La Carga masiva lanza muchas campañas desde una sola hoja de cálculo: una fila por campaña. Haz clic en 📤 Carga masiva, pega el ejemplo y lanza. Los profesionales la usan para lanzar 20 anuncios en segundos en vez de crearlos uno por uno.',
    rel: ['bulk_errors', 'naming'] },
  { id: 'bulk_errors',
    label: ['How do I fix bulk upload errors?', '¿Cómo corrijo errores de la carga masiva?'],
    kw: ['bulk & error*', 'carga & error*', 'bulk & fix', 'csv & error*', 'bulk error*', 'error de carga', 'errores de carga', 'validation', 'validacion', 'row error', 'error en la fila', 'not a valid objective', 'no es un objetivo valido', 'expected 7 columns', 'se esperaban 7 columnas', 'missing cta', 'falta la llamada'],
    en: "Read the message — it names the exact row and problem. Common fixes: use the exact words for objectives (awareness, traffic, engagement, leads, sales) and audiences (broad, interest, lookalike, narrow), make budget a number ≥ 5, fill in every column, and don't use commas inside a cell (they split columns).",
    es: 'Lee el mensaje: dice la fila exacta y el problema. Correcciones comunes: usa las palabras exactas para objetivos (awareness, traffic, engagement, leads, sales) y públicos (broad, interest, lookalike, narrow), que el presupuesto sea un número ≥ 5, llena todas las columnas y no uses comas dentro de una celda (separan las columnas).',
    rel: ['bulk'] },
  { id: 'adlibrary',
    label: ['What is the Ad Library?', '¿Qué es la Biblioteca de anuncios?'],
    kw: ['ad library', 'biblioteca de anuncios', 'competitor*', 'competencia', 'competidor*', 'research', 'investigar', 'investigacion', 'spy on', 'espiar'],
    en: "Meta Ad Library (facebook.com/ads/library) is a free public tool showing every active ad on Facebook and Instagram — no login needed. Use it to study competitors' hooks, offers, and formats. Click 🔎 Ad Library for a guided research mission. Study patterns; never copy.",
    es: 'La Biblioteca de anuncios de Meta (facebook.com/ads/library) es una herramienta pública y gratuita que muestra todos los anuncios activos en Facebook e Instagram, sin iniciar sesión. Úsala para estudiar los ganchos, ofertas y formatos de la competencia. Haz clic en 🔎 Biblioteca de anuncios para una misión guiada. Estudia patrones; nunca copies.',
    rel: ['copying', 'angles'] },
  { id: 'pixel',

// ═══════════════════════════════════════════════════════════════════
// STATE + PERSISTENCE (graceful: works on Netlify, silent elsewhere)
// ═══════════════════════════════════════════════════════════════════
const STORE_KEY = 'pipers_sandbox_v5';
const DEFAULT_PREFS = { lang: null, sfx: true, voice: false, voiceName: '', rate: 1, onboarded: false, guide: true, coachOpen: null, sampleSeen: false };

function defaultPlayer() { return { xp: 0, track: null, badges: [], assessed: false, missions: {} }; }

let state = {
  view: 'campaigns', activeTab: 'campaigns', campaigns: [], selectedCampaignId: null,
  createStep: 0, draft: null, piperOpen: false, search: '', selectedIds: [],
  player: defaultPlayer(),
  prefs: Object.assign({}, DEFAULT_PREFS),
};

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ campaigns: state.campaigns, player: state.player, prefs: state.prefs })); } catch (e) { /* storage unavailable — in-memory only */ }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state.campaigns = data.campaigns || [];
      state.player = Object.assign(defaultPlayer(), data.player || {});
      state.prefs = Object.assign({}, DEFAULT_PREFS, data.prefs || {});
    }
  } catch (e) { /* ignore */ }
  if (!state.prefs.lang) state.prefs.lang = /^es\b/i.test(navigator.language || '') ? 'es' : 'en';
}

// ═══════════════════════════════════════════════════════════════════
// LANGUAGE  —  t('key', {vars}) looks up the active language, falls back to English
// ═══════════════════════════════════════════════════════════════════
const LANGS = { en: LANG_EN, es: LANG_ES };
function lang() { return state.prefs.lang === 'es' ? 'es' : 'en'; }
function t(key, vars) {
  let s = LANGS[lang()][key];
  if (s === undefined) s = LANG_EN[key];
  if (s === undefined) { console.warn('[i18n] missing key:', key); return key; }
  if (typeof s === 'function') return s(vars || {});
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m)) : s;
}
function money(n) { return '$' + Number(n).toFixed(2); }

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

// ═══════════════════════════════════════════════════════════════════
// SOUND EFFECTS — synthesized with Web Audio, so there are no files to load or license
// Any element with data-sfx="name" plays that sound when clicked.
// ═══════════════════════════════════════════════════════════════════
const Sfx = (() => {
  let ctx = null;
  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, opts) {
    const o2 = Object.assign({ type: 'sine', vol: 0.15, slide: 0 }, opts);
    const a = ac(); if (!a) return;
    const t0 = a.currentTime + start;
    const osc = a.createOscillator(), gain = a.createGain();
    osc.type = o2.type;
    osc.frequency.setValueAtTime(freq, t0);
    if (o2.slide) osc.frequency.exponentialRampToValueAtTime(freq * o2.slide, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(o2.vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  const SOUNDS = {
    click:   () => tone(700, 0, 0.06, { type: 'triangle', vol: 0.09 }),
    pop:     () => tone(480, 0, 0.13, { type: 'sine', vol: 0.16, slide: 1.7 }),
    next:    () => { tone(587, 0, 0.12, { type: 'triangle', vol: 0.12 }); tone(880, 0.08, 0.18, { type: 'triangle', vol: 0.12 }); },
    tour:    () => tone(784, 0, 0.12, { type: 'sine', vol: 0.11 }),
    xp:      () => { tone(988, 0, 0.09, { type: 'square', vol: 0.045 }); tone(1319, 0.07, 0.2, { type: 'square', vol: 0.045 }); },
    success: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.3, { type: 'triangle', vol: 0.14 })),
    levelup: () => { [523, 659, 784].forEach((f, i) => tone(f, i * 0.11, 0.2, { type: 'square', vol: 0.05 })); tone(1047, 0.34, 0.6, { type: 'triangle', vol: 0.16 }); tone(1319, 0.34, 0.6, { type: 'triangle', vol: 0.1 }); tone(1568, 0.34, 0.6, { type: 'sine', vol: 0.06 }); },
    badge:   () => [1568, 2093, 2637].forEach((f, i) => tone(f, i * 0.07, 0.25, { type: 'sine', vol: 0.08 })),
    error:   () => { tone(233, 0, 0.15, { type: 'sawtooth', vol: 0.05 }); tone(196, 0.12, 0.22, { type: 'sawtooth', vol: 0.05 }); },
  };
  function play(name) {
    if (!state.prefs.sfx || !SOUNDS[name]) return;
    try { SOUNDS[name](); } catch (e) { /* audio blocked — stay silent */ }
  }
  return { play, unlock: () => { try { ac(); } catch (e) {} } };
})();

document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-sfx]');
  if (el && !el.disabled) Sfx.play(el.dataset.sfx);
}, true);

// ═══════════════════════════════════════════════════════════════════
// READ ALOUD — the browser's built-in voice (free, offline, any text)
// ═══════════════════════════════════════════════════════════════════
const Voice = (() => {
  const synth = window.speechSynthesis;
  const supported = !!synth && typeof window.SpeechSynthesisUtterance !== 'undefined';
  let voices = [], gen = 0;

  function load() { if (supported) voices = synth.getVoices() || []; }
  if (supported) {
    load();
    if (synth.addEventListener) synth.addEventListener('voiceschanged', () => { load(); if (typeof onVoicesChanged === 'function') onVoicesChanged(); });
  }

  // macOS ships joke/singing voices (Bubbles, Bad News, Zarvox…) — never offer those as Piper.
  const NOVELTY = /^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy|grandma|grandpa)\b/i;
  const nice = v => (/natural|neural|premium|enhanced|google|samantha|paulina|monica|mónica|siri|aria|jenny|sabina|dalia|daniel|karen|moira|tessa/i.test(v.name) ? 1 : 0);
  function voicesFor(l) {
    return voices
      .filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith(l) && !NOVELTY.test(v.name))
      .sort((a, b) => nice(b) - nice(a));
  }

  function pick() {
    const list = voicesFor(lang());
    const chosen = list.find(v => v.name === state.prefs.voiceName);
    if (chosen) return chosen;
    const order = lang() === 'es' ? ['es-us', 'es-mx', 'es-419', 'es-es'] : ['en-us', 'en-gb', 'en-au'];
    for (const code of order) {
      const m = list.filter(v => v.lang.toLowerCase().replace('_', '-') === code).sort((a, b) => nice(b) - nice(a));
      if (m.length) return m[0];
    }
    return list[0] || null;
  }

  // Turn screen text into something that sounds natural when spoken.
  function clean(text) {
    const es = lang() === 'es';
    return String(text)
      .replace(/<[^>]+>/g, ' ')
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}\u{2190}-\u{21FF}✓✕➤▦]/gu, ' ')
      .replace(/\bA\/B\b/g, 'A B')
      .replace(/\$(\d[\d,.]*)\s*\/\s*(day|d|día)\b/g, es ? '$1 dólares por día' : '$1 dollars per day')
      .replace(/\/\s*(day|día)\b/g, es ? ' por día' : ' per day')
      .replace(/(\d)x\b/g, es ? '$1 veces' : '$1 times')
      .replace(/[•·|]/g, ', ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Chrome stops long utterances after ~15s, so speak sentence-sized chunks.
  function chunks(s) {
    const parts = s.replace(/([.!?…])\s+/g, '$1\u0000').split('\u0000');
    const out = [];
    parts.forEach(p => {
      if (out.length && (out[out.length - 1] + ' ' + p).length < 180) out[out.length - 1] += ' ' + p;
      else out.push(p);
    });
    return out.filter(Boolean);
  }

  function enqueue(s) {
    const v = pick();
    chunks(s).forEach(part => {
      const u = new SpeechSynthesisUtterance(part);
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = lang() === 'es' ? 'es-US' : 'en-US';
      u.rate = state.prefs.rate || 1;
      u.pitch = 1.05;
      synth.speak(u);
    });
  }

  // force: speak even when Read aloud is off (used by the 🔊 replay buttons)
  function speak(text, force) {
    if (!supported || (!force && !state.prefs.voice)) return;
    const s = clean(text);
    if (!s) return;
    const my = ++gen;
    synth.cancel();
    setTimeout(() => { if (my === gen) enqueue(s); }, 60);
  }
  function stop() { if (supported) { gen++; synth.cancel(); } }

  return { supported, speak, stop, voicesFor, pick };
})();

window.addEventListener('pagehide', () => Voice.stop());

// Hover (mouse) or focus (keyboard) on anything with data-say / data-say-text reads its explanation.
const HoverSay = (() => {
  let current = null, timer = null, last = { el: null, at: 0 };
  function textFor(el) { return el.dataset.sayText || (el.dataset.say ? t(el.dataset.say) : ''); }
  function arm(el, delay) {
    clearTimeout(timer);
    current = el;
    if (!el || !state.prefs.voice) return;
    timer = setTimeout(() => {
      if (current !== el || !el.isConnected) return;
      if (last.el === el && Date.now() - last.at < 4000) return;
      last = { el, at: Date.now() };
      Voice.speak(textFor(el));
    }, delay);
  }
  document.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const el = e.target.closest && e.target.closest('[data-say],[data-say-text]');
    if (el !== current) arm(el, 550);
  });
  document.addEventListener('pointerout', e => {
    if (current && (!e.relatedTarget || !current.contains(e.relatedTarget))) { clearTimeout(timer); current = null; }
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('[data-say],[data-say-text]');
    if (el && e.target.matches(':focus-visible')) arm(el, 300);
  });
  return {};
})();

// XP / LEVELS / BADGES
// ═══════════════════════════════════════════════════════════════════
const LEVELS = [
  { min: 0,    key: 'lvl.1', next: 400 },
  { min: 400,  key: 'lvl.2', next: 900 },
  { min: 900,  key: 'lvl.3', next: 1500 },
  { min: 1500, key: 'lvl.4', next: null },
];
const BADGES = ['launch', 'data', 'lab', 'bulk', 'deck', 'research', 'ruthless', 'cloner', 'fresh', 'profit'];

function currentLevel() { return LEVELS.slice().reverse().find(l => state.player.xp >= l.min); }
function levelName(l) { return t(l.key); }

function awardXP(amount, reasonKey, vars) {
  const before = currentLevel();
  state.player.xp += amount;
  const after = currentLevel();
  toast(t('toast.xp', { n: amount, reason: t(reasonKey, vars) }));
  Sfx.play('xp');
  const w = document.getElementById('xpWidget');
  if (w) { w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump'); }
  if (after.min !== before.min) {
    setTimeout(() => {
      toast(t('toast.levelup', { level: levelName(after) }), true);
      Sfx.play('levelup'); showConfetti(); pipeReact('celebrate'); coinRain();
      pipeSay(after.next ? t('piper.levelup', { level: levelName(after), next: after.next }) : t('piper.levelup.max', { level: levelName(after) }));
    }, 700);
  }
  updateXPWidget(); saveState();
}

function earnBadge(id) {
  if (state.player.badges.includes(id)) return;
  state.player.badges.push(id);
  setTimeout(() => { toast(t('toast.badge', { badge: t('badge.' + id) }), true); Sfx.play('badge'); }, 1300);
  saveState();
}

function updateXPWidget() {
  const lvl = currentLevel();
  const lv = document.getElementById('xpLevel'), num = document.getElementById('xpNum'), fill = document.getElementById('xpFill');
  if (!lv) return;
  lv.textContent = levelName(lvl);
  num.textContent = state.player.xp + ' XP';
  const pct = lvl.next ? Math.min(100, ((state.player.xp - lvl.min) / (lvl.next - lvl.min)) * 100) : 100;
  fill.style.width = pct + '%';
}

// ═══════════════════════════════════════════════════════════════════
// TOASTS + CONFETTI
// ═══════════════════════════════════════════════════════════════════
function toast(text, special) {
  let stack = document.getElementById('toastStack');
  if (!stack) { stack = document.createElement('div'); stack.id = 'toastStack'; stack.className = 'toast-stack'; stack.setAttribute('aria-live', 'polite'); document.body.appendChild(stack); }
  const el = document.createElement('div');
  el.className = 'toast' + (special ? ' levelup' : '');
  el.textContent = text;
  stack.appendChild(el);
  setTimeout(() => el.remove(), special ? 3400 : 2600);
}

function showConfetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#0866FF', '#00A656', '#F7B928', '#D62839', '#A78BFA'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animation = `confetti-fall ${1 + Math.random()}s linear forwards`;
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2500);
  }
}

let _reactTimer = null;

function initMascots() {

  const a = document.getElementById('avatarImg'); if (a) a.src = PIPER_IMG.face;

// kind: 'coach' | 'celebrate' | 'panic' | 'grumpy' — pops up for ~3 seconds, then fades
function pipeReact(kind) {
  const el = document.getElementById('piperReact');
  const src = PIPER_IMG['r_' + kind];
  if (!el || !src) return;
  el.src = src;
  el.alt = t('react.' + kind);

  el.classList.add('show', 'pop');

  _reactTimer = setTimeout(() => el.classList.remove('show', 'pop'), 2800);
}

function reducedMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

// Dollar bills flying up and off the screen = money being lost
function moneyFly() {
  if (reducedMotion()) return;
  const bills = ['💵', '💸', '💴', '🪙'];
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    b.className = 'money-fx';
    b.textContent = bills[i % bills.length];
    b.style.left = (12 + Math.random() * 74) + 'vw';
    b.style.bottom = (6 + Math.random() * 12) + 'vh';
    b.style.setProperty('--dx', ((Math.random() * 2 - 1) * 55).toFixed(1) + 'vw');
    b.style.animationDelay = (Math.random() * 0.35).toFixed(2) + 's';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 2000);
  }
}

// Coins raining down = money being made
function coinRain() {
  if (reducedMotion()) return;
  const coins = ['🪙', '💰', '💵'];
  for (let i = 0; i < 16; i++) {
    const c = document.createElement('div');

  }
}

// Piper's reaction to a campaign's verdict (once per verdict change, so re-opening a page stays calm)
const _reacted = {};
function reactToVerdict(c) {
  const v = campaignVerdict(c);
  if (_reacted[c.id] === v.id) return;
  _reacted[c.id] = v.id;
  const roas = Number(c.totals.roas);
  if (v.id === 'kill' && roas < 1) { pipeReact('panic'); moneyFly(); Sfx.play('error'); }
  else if (v.id === 'kill') { pipeReact('grumpy'); }
  else if (v.id === 'scale') { pipeReact('celebrate'); coinRain(); Sfx.play('badge'); }
  else if (v.id === 'refresh') { pipeReact('grumpy'); }
}


// ─── engine.js ───
// ═══════════════════════════════════════════════════════════════════
// SIMULATION ENGINE v3 — runs day by day, so campaigns can keep going week after week.
// Each campaign carries c.sim (its running state) and a seed, so its "luck" is
// reproducible: re-rendering never changes results, and two campaigns differ only
// where their settings, copy, or seeds differ.
// ═══════════════════════════════════════════════════════════════════
const SIM = {
  aov: 45,            // revenue per conversion (sale or lead value)
  margin: 0.6,        // product margin → break-even ROAS = 1 / 0.6 ≈ 1.67x
  targetRoas: 2.5,    // the practice "winner" bar
  firstFlight: 14,    // days simulated at launch (Learning Phase + one clean week)
  objective: {        // base CPM ($), CTR, conversion rate after learning
    awareness:  { cpm: 6,  ctr: 0.008, cvr: 0.006 },
    traffic:    { cpm: 9,  ctr: 0.018, cvr: 0.012 },
    engagement: { cpm: 7,  ctr: 0.012, cvr: 0.008 },
    leads:      { cpm: 15, ctr: 0.013, cvr: 0.06 },
    sales:      { cpm: 14, ctr: 0.014, cvr: 0.04 },
  },
  audience: {         // multipliers + pool (people reachable before fatigue) + capacity ($/day before costs climb)
    broad:     { cpm: 1.00, ctr: 1.00, cvr: 1.00, pool: 400000, capacity: 300 },
    interest:  { cpm: 1.15, ctr: 1.05, cvr: 1.05, pool: 60000,  capacity: 120 },
    lookalike: { cpm: 1.25, ctr: 1.08, cvr: 1.35, pool: 150000, capacity: 160 },
    narrow:    { cpm: 1.80, ctr: 1.10, cvr: 1.20, pool: 7000,   capacity: 40 },
  },
};
const BREAK_EVEN_ROAS = 1 / SIM.margin;

// Deterministic randomness: same seed + day + salt → same number (0..1)
function simRand(seed, day, salt) {
  let x = (seed ^ Math.imul(day + 1, 0x9E3779B1) ^ Math.imul(salt + 1, 0x85EBCA6B)) >>> 0;
  x = Math.imul(x ^ (x >>> 16), 0x7FEB352D);
  x = Math.imul(x ^ (x >>> 15), 0x846CA68B);
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function simHash(s) {
  let h = 2166136261;
  for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function newSeed() { return (Math.random() * 4294967296) >>> 0; }

// How well the copy is likely to work. Visible craft (length, specifics, an offer, talking
// to "you", a CTA that fits the goal) plus a hidden "market fit" per headline — only
// testing reveals that part, which is exactly why media buyers A/B test.
function creativeQuality(cr, objective) {
  const h = String(cr.headline || '').trim(), b = String(cr.body || '').trim(), all = h + ' ' + b;
  let q = 1;
  q += h.length < 8 ? -0.15 : 0.04;
  q += b.length < 30 ? -0.12 : b.length >= 60 ? 0.05 : 0;
  if (/\d/.test(all)) q += 0.05;
  if (/\?/.test(h)) q += 0.03;
  if (/(free|save|off\b|%|bundle|gratis|ahorra|descuento|env[ií]o)/i.test(all)) q += 0.05;
  if (/\b(you|your|tu|tus|te)\b/i.test(all)) q += 0.03;
  if (/!{2,}|\b[A-Z]{5,}\b/.test(h)) q -= 0.08;
  const ctaFit = { sales: ['shop', 'offer'], leads: ['signup', 'learn', 'book'], traffic: ['learn'] }[objective] || [];
  if (ctaFit.includes(cr.cta)) q += 0.03;
  q *= 0.84 + (simHash(h.toLowerCase()) % 1000) / 1000 * 0.34;
  return Math.max(0.6, Math.min(1.45, q));
}

function simInit(c, seed) {
  c.sim = {
    seed: seed != null ? seed : newSeed(),
    quality: creativeQuality(c.creative, c.objective),
    cumImps: 0,         // impressions on the current creative (drives frequency)
    learnLen: 7, learnLeft: 7, learnFloor: 0.55,
    pausedWeeks: 0,
  };
  c.days = [];
  c.status = c.status || 'active';
}

function simDay(c) {
  const s = c.sim, o = SIM.objective[c.objective], a = SIM.audience[c.audience];
  const day = c.days.length + 1;
  const r = k => simRand(s.seed, day, k);

  let learnP = 1, phase = 'optimized';
  if (s.learnLeft > 0) { learnP = (s.learnLen - s.learnLeft) / s.learnLen; phase = 'learning'; }
  const learnCvr = s.learnFloor + (1 - s.learnFloor) * learnP;

  const n = c.placements.length;
  const placeCpm = n >= 4 ? 0.9 : n === 1 ? 1.12 : 1;

  // diminishing returns: spending past the audience's comfortable capacity costs more per result
  const ratio = c.budget / a.capacity;
  const capCpm = 1 + 0.35 * Math.pow(ratio, 1.5);
  const capCvr = 1 - 0.15 * Math.min(1.5, ratio);

  // fatigue: once the average person has seen the ad ~2+ times, clicks fall and costs creep up
  const reachBefore = a.pool * (1 - Math.exp(-s.cumImps / a.pool));
  const freqBefore = s.cumImps ? s.cumImps / Math.max(1, reachBefore) : 1;
  const over = Math.max(0, freqBefore - 1.8);
  const fatCtr = 1 / (1 + 0.25 * over), fatCvr = 1 / (1 + 0.08 * over), fatCpm = 1 + 0.06 * over;

  const spend = c.budget * (0.9 + 0.2 * r(1));
  const cpm = o.cpm * a.cpm * placeCpm * capCpm * fatCpm * (1.15 - 0.15 * learnP) * (0.88 + 0.24 * r(2));
  const impressions = Math.max(0, Math.round(spend / cpm * 1000));
  const ctr = o.ctr * a.ctr * s.quality * fatCtr * (0.85 + 0.15 * learnP) * (0.85 + 0.3 * r(3));
  const clicks = Math.round(impressions * ctr);
  const cvr = o.cvr * a.cvr * Math.pow(s.quality, 0.3) * capCvr * fatCvr * learnCvr * (0.75 + 0.5 * r(4));
  const expected = clicks * cvr;
  const conversions = Math.floor(expected) + (r(5) < expected % 1 ? 1 : 0); // fair rounding, no bias
  const revenue = conversions * SIM.aov;

  s.cumImps += impressions;
  const reach = a.pool * (1 - Math.exp(-s.cumImps / a.pool));
  if (s.learnLeft > 0) s.learnLeft--;

  const d = {
    day, phase, budget: c.budget,
    spend: Number(spend.toFixed(2)), impressions, clicks, conversions, revenue,
    ctr: Number((impressions ? clicks / impressions * 100 : 0).toFixed(2)),
    cpm: Number(cpm.toFixed(2)),
    cpc: clicks ? Number((spend / clicks).toFixed(2)) : 0,
    cpa: conversions ? Number((spend / conversions).toFixed(2)) : 0,
    roas: Number((revenue / spend).toFixed(2)),
    freq: Number((s.cumImps / Math.max(1, reach)).toFixed(2)),
  };
  if (s.pendingEvent) { d.event = s.pendingEvent; s.pendingEvent = null; }
  c.days.push(d);
  return d;
}

function simRun(c, nDays) {
  for (let i = 0; i < nDays; i++) simDay(c);
  c.totals = calculateTotals(c.days);
}

function calculateTotals(days) {
  const totals = days.reduce((acc, d) => ({
    spend: acc.spend + d.spend,
    impressions: acc.impressions + d.impressions,
    clicks: acc.clicks + d.clicks,
    conversions: acc.conversions + d.conversions,
    revenue: acc.revenue + d.revenue,
  }), { spend: 0, impressions: 0, clicks: 0, conversions: 0, revenue: 0 });
  totals.ctr = totals.impressions ? (totals.clicks / totals.impressions * 100).toFixed(2) : 0;
  totals.cpa = totals.conversions ? (totals.spend / totals.conversions).toFixed(2) : '—';
  totals.roas = totals.spend ? (totals.revenue / totals.spend).toFixed(2) : 0;
  totals.cpc = totals.clicks ? (totals.spend / totals.clicks).toFixed(2) : '—';
  totals.freq = days.length ? days[days.length - 1].freq : 0;
  return totals;
}

// Create + run a brand-new campaign (launch, duplicate, bulk upload, A/B versions, clones).
// days defaults to the first 14-day flight; clones start at 0 and run with the weekly review.
function newCampaign(fields, seed, days) {
  const c = Object.assign({ id: 'c' + Date.now() + Math.floor(Math.random() * 99999), status: 'active' }, fields);
  c.placements = (c.placements || ['fb_feed', 'ig_feed']).slice();
  c.creative = Object.assign({}, c.creative);
  simInit(c, seed);
  simRun(c, days == null ? SIM.firstFlight : days);
  return c;
}

// Saved campaigns from before this engine get rebuilt once.
function migrateCampaign(c) {
  if (c.sim && c.sim.quality) return;
  const name = c.name;
  simInit(c);
  simRun(c, Math.max(SIM.firstFlight, (c.days || []).length));
  c.name = name;
}

// ── Changes that apply to the coming days ─────────────────────────
function simRelearn(c, days) {
  const s = c.sim;
  s.learnLen = days; s.learnLeft = days; s.learnFloor = 0.7; // re-learning starts smarter than day 1
}
// Big budget jumps (>20%) restart learning: +50% ≈ 3 days, ×2 ≈ a full week
function simChangeBudget(c, newBudget) {
  const old = c.budget;
  c.budget = Math.max(5, Math.round(newBudget));
  if (c.budget === old) return 0;
  const pct = (c.budget - old) / old;
  c.sim.pendingEvent = { type: 'budget', from: old, to: c.budget };
  if (Math.abs(pct) > 0.2) simRelearn(c, Math.min(7, Math.max(2, Math.round(Math.abs(pct) * 100 / 15))));
  return pct;
}
// A new creative: fresh frequency (nobody has seen it yet), new quality, and a short relearn
function simRefresh(c, headline) {
  c.creative.headline = headline;
  c.sim.quality = creativeQuality(c.creative, c.objective);
  c.sim.cumImps = 0;
  c.sim.pendingEvent = { type: 'refresh' };
  simRelearn(c, 4);
}
function simResume(c) {
  c.status = 'active';
  if (c.sim.pausedWeeks > 0) { simRelearn(c, 3); c.sim.pendingEvent = { type: 'resume' }; }
  c.sim.pausedWeeks = 0;
}

// ── Reading results ───────────────────────────────────────────────
function windowTotals(c, n, offset) {
  const end = c.days.length - (offset || 0), start = Math.max(0, end - n);
  const ds = c.days.slice(start, Math.max(start, end));
  const w = ds.reduce((a, d) => {
    a.spend += d.spend; a.revenue += d.revenue; a.conversions += d.conversions;
    a.clicks += d.clicks; a.impressions += d.impressions; if (d.phase === 'learning') a.learningDays++;
    return a;
  }, { spend: 0, revenue: 0, conversions: 0, clicks: 0, impressions: 0, learningDays: 0 });
  w.days = ds.length;
  w.roas = w.spend ? w.revenue / w.spend : 0;
  w.cpa = w.conversions ? w.spend / w.conversions : null;
  w.ctr = w.impressions ? w.clicks / w.impressions * 100 : 0;
  w.freq = ds.length ? ds[ds.length - 1].freq : 0;
  return w;
}

// Piper's read on a campaign, based on its last 7 days
function campaignVerdict(c) {
  if (c.status !== 'active') return { id: 'paused' };
  const w = windowTotals(c, 7);
  if (!w.days || w.learningDays >= 4) return { id: 'learning', w };
  const prev = windowTotals(c, 7, 7);
  if (w.roas < BREAK_EVEN_ROAS && w.spend >= 60) return { id: 'kill', w };
  if (w.freq >= 3 && (prev.days < 7 || w.roas <= prev.roas || w.roas < SIM.targetRoas)) return { id: 'refresh', w };
  if (w.roas >= SIM.targetRoas && w.freq < 3) return { id: 'scale', w };
  return { id: 'keep', w };
}

// Whole-account money picture (all campaigns), optionally just the last n days of each
function accountTotals(n, offset) {
  const t = { spend: 0, revenue: 0, conversions: 0 };
  state.campaigns.forEach(c => {
    if (n && c.status !== 'active') return; // a paused campaign's last days are old news
    const w = n ? windowTotals(c, n, offset) : { spend: c.totals.spend, revenue: c.totals.revenue, conversions: c.totals.conversions };
    t.spend += w.spend; t.revenue += w.revenue; t.conversions += w.conversions;
  });
  t.roas = t.spend ? t.revenue / t.spend : 0;
  t.profit = t.revenue * SIM.margin - t.spend;
  return t;
}

function viewCampaign(id) {
  state.selectedCampaignId = id; state.view = 'detail';
  Sfx.play('click');
  render();
  document.getElementById('mainContent').scrollTop = 0;
  const c = state.campaigns.find(x => x.id === id);
  if (!state.player.missions.firstDetail) {
    state.player.missions.firstDetail = true;
    awardXP(25, 'xp.firstResults'); earnBadge('data');
    pipeSay(t('piper.firstDetail'));
    render();
    // first results ever: explain that 14 days is a sample, then let Piper react
    if (!state.prefs.sampleSeen) { state.prefs.sampleSeen = true; saveState(); showSampleExplainer(`reactToVerdict(state.campaigns.find(x => x.id === '${id}'))`); return; }
  }
  if (c) reactToVerdict(c);
}
function backToCampaigns() { state.view = 'campaigns'; render(); }
function toggleCampaign(id) {
  const c = state.campaigns.find(x => x.id === id);
  if (!c) return;
  if (c.status === 'active') { pauseCampaign(id, false); return; } // pausing a loser counts as the loser lesson
  simResume(c); // resuming after a paused week relearns
  saveState(); render();
}

function openCreate() {
  state.createStep = 0; state.draft = defaultDraft();
