function closeCreate() { const m = document.getElementById('createModal'); if (m) m.remove(); }

let lastProgress = 0;
function renderCreateModal(entering) {
  const prev = document.getElementById('createContent');
  const keepScroll = prev && prev.dataset.step === String(state.createStep) ? prev.scrollTop : 0;
  closeCreate();
  const total = STEPS.length, step = state.createStep, guided = state.prefs.guide;
  const pct = ((step + 1) / total) * 100;
  const modal = document.createElement('div');
  modal.id = 'createModal';
  modal.className = 'modal-overlay' + (entering ? ' enter' : '');
  modal.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createTitle">
      <div class="modal-header">
        <div class="modal-title" id="createTitle">${t('create.title')}</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="guide-chip ${guided ? 'on' : ''}" onclick="toggleGuide()" aria-pressed="${guided}" data-say="say.guide" data-sfx="click">✨ ${t('create.guide')}: ${guided ? t('on') : t('off')}</button>
          <button class="modal-close" onclick="closeCreate()" aria-label="${t('close')}">✕</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-nav">
          ${STEPS.map((s, i) => `
            <div class="modal-nav-item ${step === i ? 'active' : ''} ${step > i ? 'done reachable' : ''}" onclick="goToStep(${i})" title="${t('step.' + s)}">
              <div class="step-num">${step > i ? '✓' : i + 1}</div>
              <span>${t('step.' + s)}</span>
            </div>`).join('')}
        </div>
        <div class="modal-content" id="createContent" data-step="${step}">
          <div class="step-progress" aria-hidden="true"><div id="stepProgress" style="width:${lastProgress || pct}%"></div></div>
          ${guided ? '<div class="guide-banner" id="guideBanner" role="status"></div>' : ''}
          ${stepLessonHTML()}
          ${renderCreateStep()}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="${step > 0 ? 'prevStep()' : 'closeCreate()'}" data-sfx="click">${step > 0 ? '← ' + t('back') : t('cancel')}</button>
        <div class="step-counter">${t('create.stepOf', { n: step + 1, total })}</div>
        ${step < total - 1
          ? `<button class="btn btn-primary" id="nextBtn" onclick="nextStep()" ${canProceed() ? '' : 'disabled'} data-sfx="next" data-say="say.next">${t('next')} →</button>`
          : `<button class="btn btn-success" id="publishBtn" onclick="launchCampaign()" data-say="say.publish">🚀 ${t('create.publish')}</button>`}
      </div>
    </div>`;
  document.body.appendChild(modal);
  const content = document.getElementById('createContent');
  if (keepScroll) content.scrollTop = keepScroll;
  requestAnimationFrame(() => { const bar = document.getElementById('stepProgress'); if (bar) bar.style.width = pct + '%'; });
  lastProgress = pct;
  applyCreateGuide();
}

// state-only updates (no re-render → no focus loss)
function updateDraft(key, val) { state.draft[key] = val; refreshNextBtn(); }
function updateCreative(key, val) { state.draft.creative[key] = val; refreshNextBtn(); }
function selectDraft(key, val) { state.draft[key] = val; renderCreateModal(); }
function togglePlacement(id) {
  const p = state.draft.placements, i = p.indexOf(id);
  if (i >= 0) p.splice(i, 1); else p.push(id);
  renderCreateModal();
}
function updateBudgetHint() {
  const el = document.getElementById('budgetHint');
  if (el) el.textContent = t('c3.hint', { total: ((state.draft.budget || 0) * 14).toFixed(2) });
}
function refreshNextBtn() {
  const btn = document.getElementById('nextBtn');
  if (btn) btn.disabled = !canProceed();
  applyCreateGuide();
}

function canProceed() {
  const d = state.draft, s = state.createStep;
  if (s === 0) return d.name.trim().length > 0 && !!d.objective;
  if (s === 1) return !!d.audience;
  if (s === 2) return d.placements.length > 0;
  if (s === 3) return d.budget >= 5;
  if (s === 4) return d.creative.headline.trim().length > 0 && d.creative.body.trim().length > 0;
  return true;
}

function nextStep() {
  if (!canProceed()) { Sfx.play('error'); pipeSay(t('piper.almost')); return; }
  state.createStep++; renderCreateModal(); pipeOnStepChange(state.createStep);
}
function prevStep() { state.createStep--; renderCreateModal(); }
function goToStep(i) { if (i < state.createStep) { state.createStep = i; Sfx.play('click'); renderCreateModal(); } }

function launchCampaign() {
  const d = state.draft;
  const c = newCampaign({ name: d.name, objective: d.objective, audience: d.audience, placements: d.placements, budget: d.budget, creative: d.creative });
  state.campaigns.unshift(c);
  closeCreate(); showConfetti(); Sfx.play('success'); pipeReact('celebrate');
  state.view = 'campaigns'; state.activeTab = 'campaigns';
  const first = !state.player.missions.firstLaunch;
  if (first) { state.player.missions.firstLaunch = true; earnBadge('launch'); }
  saveState(); render();
  awardXP(75, 'xp.launch');
  pipeSay(t('piper.launched'));
}

function abReady() {
  if (!abDraft || !abDraft.variable) return false;
  if (abDraft.variable === 'headline') return abDraft.newHeadline.trim().length > 0;
  if (abDraft.variable === 'audience') return !!abDraft.newAudience;
  return true;
}

function runABTest() {
  if (abDraft.variable === 'headline') abDraft.newHeadline = (document.getElementById('abHeadline') || {}).value || abDraft.newHeadline;
  if (!abReady()) { renderABSetup(); return; }

  const base = state.campaigns.find(c => c.id === abDraft.baseId);
  const root = base.name.replace(/ \[A\]| \[B\]/g, '');
  const fields = { objective: base.objective, audience: base.audience, placements: base.placements, budget: base.budget, creative: base.creative };
  const a = newCampaign(Object.assign({}, fields, { name: root + ' [A]', abLabel: 'A' }));
  const bFields = Object.assign({}, fields, { name: root + ' [B]', abLabel: 'B', creative: Object.assign({}, base.creative) });
  if (abDraft.variable === 'headline') bFields.creative.headline = abDraft.newHeadline;
  if (abDraft.variable === 'audience') bFields.audience = abDraft.newAudience;
  if (abDraft.variable === 'budget') bFields.budget = Math.round(base.budget * 1.5);
  const b = newCampaign(bFields);
  state.campaigns.unshift(b);
  state.campaigns.unshift(a);

  closeSimpleModal(); saveState(); render();
  Sfx.play('success');
  showABResults(a, b);
  awardXP(100, 'xp.ab');
  earnBadge('lab');
}

function showABResults(a, b) {
  const winner = Number(b.totals.roas) > Number(a.totals.roas) ? b : a;
  const loser = winner === a ? b : a;
  // Within 10% of each other = too close to call: teach patience instead of crowning luck
  const tie = Math.abs(Number(a.totals.roas) - Number(b.totals.roas)) / Math.max(Number(a.totals.roas), Number(b.totals.roas), 0.01) < 0.1;
  const metric = c => `
    <div class="ab-metric"><span>CTR</span><b>${c.totals.ctr}%</b></div>
    <div class="ab-metric"><span>CPC</span><b>$${c.totals.cpc}</b></div>
    <div class="ab-metric"><span>${t('stat.conversions')}</span><b>${c.totals.conversions}</b></div>
    <div class="ab-metric"><span>CPA</span><b>$${c.totals.cpa}</b></div>
    <div class="ab-metric"><span>ROAS</span><b>${c.totals.roas}x</b></div>`;
  const won = c => !tie && winner === c;
  const col = (c, label) => `<div class="ab-col ${won(c) ? 'winner' : ''}"><div class="ab-tag">${t('ab.version', { v: label })} ${won(c) ? '· ' + t('ab.winner') + ' 🏆' : ''}</div><div style="font-weight:700;margin-bottom:8px;">${esc(c.creative.headline)} <span style="font-weight:500;color:#65676B;">· ${audName(c.audience)} · $${c.budget}/${t('perDayShort')}</span></div>${metric(c)}</div>`;
  openSimpleModal('🧪 ' + t('ab.resultsTitle'), `
    <p style="margin-bottom:12px;font-size:13px;color:#65676B;">${t('ab.changed', { what: t('ab.changed.' + abDraft.variable) })} ${t('ab.fresh')}</p>
    <div class="ab-grid">${col(a, 'A')}${col(b, 'B')}</div>
    <div class="winner-banner ${tie ? 'tie' : ''}">${tie ? t('ab.tie', { w: winner.totals.roas, l: loser.totals.roas }) : t('ab.byRoas', { v: winner.abLabel, w: winner.totals.roas, l: loser.totals.roas })}</div>
    <div class="alert alert-info"><span>📅</span><div>${t(tie ? 'ab.tieNext' : 'ab.next')}</div></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-secondary" onclick="closeSimpleModal(); render()">${t('close')}</button>
      ${tie
        ? `<button class="btn btn-success ${state.prefs.guide ? 'guide-pulse' : ''}" id="btnScale" onclick="openWeeklyReview()">📅 ${t('ab.toReviewTie')}</button>`
        : `<button class="btn btn-success ${state.prefs.guide ? 'guide-pulse' : ''}" id="btnScale" onclick="openWeeklyReview({ '${winner.id}': 'up20', '${loser.id}': 'pause' })" data-say="say.toReview">📅 ${t('ab.toReview')}</button>`}
    </div>`, false, true);
  pipeReact(tie ? 'coach' : 'celebrate');
  pipeSay(tie ? t('piper.abTie') : t('piper.abDone', { v: winner.abLabel }));
}

      <button class="btn btn-primary" onclick="processBulkUpload()" data-say="say.bulkRun">${t('bulk.run')}</button>
    </div>`, false, true);
  pipeSay(t('piper.bulkOpen'));

function processBulkUpload() {
  const raw = (document.getElementById('bulkArea').value || '').trim();
  const errBox = document.getElementById('bulkErrors');
  if (!raw) { Sfx.play('error'); errBox.innerHTML = `<div class="bulk-errors">${t('bulk.empty')}</div>`; return; }

  const lines = raw.split(/\r?\n/).filter(l => l.trim());
  const startIdx = lines[0].toLowerCase().startsWith('name,') ? 1 : 0;
  const errors = [], parsed = [];
  const validObj = OBJECTIVES.map(o => o.id), validAud = AUDIENCES.map(a => a.id);

  for (let i = startIdx; i < lines.length; i++) {
    const cols = lines[i].split(',');
    const row = i + 1;
    if (cols.length < 7) { errors.push(t('bulk.e.cols', { row, n: cols.length })); continue; }
    const [name, objective, audience, budget, headline, body, cta] = cols.map(c => c.trim());
    if (!name) errors.push(t('bulk.e.name', { row }));
    if (!validObj.includes(objective)) errors.push(t('bulk.e.obj', { row, v: esc(objective) }));
    if (!validAud.includes(audience)) errors.push(t('bulk.e.aud', { row, v: esc(audience) }));
    if (isNaN(Number(budget)) || Number(budget) < 5) errors.push(t('bulk.e.budget', { row }));
    if (!headline) errors.push(t('bulk.e.headline', { row }));
    if (!cta) errors.push(t('bulk.e.cta', { row }));
    parsed.push({ name, objective, audience, budget: Number(budget), headline, body, cta: ctaFromText(cta) });
  }

  if (errors.length) {
    Sfx.play('error'); pipeReact('grumpy');
    errBox.innerHTML = `<div class="bulk-errors"><b>⚠️ ${t('bulk.fix')}</b><br>${errors.map(e => `<div>• ${e}</div>`).join('')}</div>`;
    pipeSay(t('piper.bulkErrors'));
    return;
  }

  parsed.forEach(r => {
    state.campaigns.unshift(newCampaign({ name: r.name, objective: r.objective, audience: r.audience, budget: r.budget,
      creative: { headline: r.headline, body: r.body, cta: r.cta, libId: null } }));
  });

  closeSimpleModal(); showConfetti(); Sfx.play('success'); saveState(); render();
  awardXP(50, 'xp.bulk', { n: parsed.length });
  earnBadge('bulk');
  pipeSay(t('piper.bulkDone', { n: parsed.length }));
}

function generateDeck(id) {
  const c = state.campaigns.find(x => x.id === id); if (!c) return;
  const tt = c.totals;
  const ctrNum = Number(tt.ctr), roasNum = Number(tt.roas), cpaNum = tt.cpa === '—' ? null : Number(tt.cpa);

  else if (cpaNum !== null && cpaNum > 25) rec = 'broaden';
  else rec = 'scale';
  const v = { name: esc(c.name), obj: objName(c.objective), aud: audName(c.audience), budget: c.budget, n: c.placements.length,
              headline: esc(c.creative.headline), cta: esc(ctaLabel(c.creative.cta)), ctr: tt.ctr, cpa: tt.cpa, roas: tt.roas,
              per100: Math.max(1, Math.round(ctrNum)), goal: t('deck.goal.' + c.objective), days: c.days.length };

  const overlay = document.createElement('div');
  overlay.className = 'deck-overlay';
  overlay.id = 'deckOverlay';

let quiz = { i: 0, score: 0 };

function showSkillIntro() {
  openSimpleModal('🎯 ' + t('quiz.introTitle'), `
    <div style="text-align:center;padding:4px 0 10px;"><div style="font-size:46px;">🐱</div></div>
    <p style="margin-bottom:10px;font-size:14px;line-height:1.55;">${t('quiz.introBody')}</p>

    <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px;">
      <button class="btn btn-primary btn-lg ${state.prefs.guide ? 'guide-pulse' : ''}" onclick="startAssessment()" data-sfx="next">${t('quiz.start')}</button>
      <button class="link-btn" onclick="skipAssessment()">${t('quiz.skip')}</button>
    </div>`, true, true);
  Voice.speak(t('quiz.introTitle') + '. ' + t('quiz.introBody'));
}

function startAssessment() { quiz = { i: 0, score: 0 }; renderQuizStep(); }

function renderQuizStep() {
  const n = quiz.i + 1;
  const opts = [0, 1, 2].map(k => t(`quiz.q${n}.a${k}`));
  if (!quiz.order || quiz.order.n !== n) quiz.order = { n, idx: [0, 1, 2].sort(() => Math.random() - 0.5) };
  const shown = quiz.order.idx;
  openSimpleModal(t('quiz.title'), `
    <div class="quiz-bar"><div style="width:${(quiz.i / QUIZ_LEN) * 100}%"></div></div>
    <div class="quiz-progress">${t('quiz.progress', { n, total: QUIZ_LEN })}</div>
    <div class="quiz-q" id="quizQ">${t('quiz.q' + n)}</div>
    ${shown.map(idx => `<button class="quiz-opt" onclick="answerQuiz(${idx})" data-sfx="click" data-say-text="${esc(opts[idx])}">${opts[idx]}</button>`).join('')}
    <div style="text-align:right;margin-top:10px;"><button class="link-btn" onclick="skipAssessment()">${t('quiz.skip')}</button></div>
  `, true);
  Voice.speak(t('quiz.q' + n) + ' ' + shown.map((idx, i) => (i + 1) + '. ' + opts[idx] + '.').join(' '));
}

function answerQuiz(idx) {
  quiz.score += idx; // opts ordered weakest→strongest: 0,1,2 points
  quiz.i++;
  if (quiz.i < QUIZ_LEN) renderQuizStep();
  else finishAssessment();
}

function skipAssessment() { assignTrack('beginner', true); }

function finishAssessment() {
  const s = quiz.score; // max 16
  const track = s <= 6 ? 'beginner' : s <= 11 ? 'intermediate' : 'expert';
  assignTrack(track, false, s);
}

function assignTrack(track, skipped, score) {

let piperUnread = 0, piperGreeted = false, peekTimer = null;

function togglePiper() {
  state.piperOpen = !state.piperOpen;
  const panel = document.getElementById('piperPanel');
  panel.style.display = state.piperOpen ? 'flex' : 'none';
  document.getElementById('piperFab').classList.remove('bouncing');
  if (state.piperOpen) { piperUnread = 0; updatePiperBadge(); hidePeek(); }

  if (state.piperOpen && !piperGreeted) {
    piperGreeted = true;
    const fresh = document.getElementById('piperMessages').children.length === 0;
    if (fresh) { pipeReact('coach'); pipeSay(t('piper.hello')); }
    setTimeout(() => {
      addPiperOptions([
        { text: t('piper.opt.create'), action: () => openCreate() },
        { text: t('piper.opt.what'), action: () => answerFromLibrary('ads_manager') },
        { text: t('piper.opt.learning'), action: () => answerFromLibrary('learning') },
        { text: t('piper.opt.tour'), action: () => startTour(TOUR_MAIN) },
        browseChip(),
      ]);
    }, fresh ? 800 : 100);
  }
  // On a campaign page, offer Piper's data-aware questions about THIS campaign (once per campaign)
  if (state.piperOpen && state.view === 'detail' && state.campaigns.length && panel.dataset.ctx !== state.selectedCampaignId) {
    panel.dataset.ctx = state.selectedCampaignId;
    setTimeout(() => addPiperOptions(piperContextChips()), piperGreeted ? 1500 : 400);
  }
  if (state.piperOpen) setTimeout(() => document.getElementById('piperInput').focus({ preventScroll: true }), 50);
}

// While the chat is closed, Piper "whispers": an unread count on the cat plus a short bubble beside it.
function updatePiperBadge() {
  const fab = document.getElementById('piperFab');
  let b = fab.querySelector('.piper-badge');
  if (!piperUnread) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('span'); b.className = 'piper-badge'; fab.appendChild(b); }
  b.textContent = piperUnread > 9 ? '9+' : piperUnread;
}
function showPeek(text) {
  hidePeek();
  const el = document.createElement('div');
  el.className = 'piper-peek';
  el.id = 'piperPeek';
  el.setAttribute('role', 'status');
  el.innerHTML = `<b>Piper:</b> ${esc(text)}`;
  el.onclick = () => { if (!state.piperOpen) togglePiper(); };
  document.body.appendChild(el);
  peekTimer = setTimeout(hidePeek, 7000);
}
function hidePeek() { clearTimeout(peekTimer); const el = document.getElementById('piperPeek'); if (el) el.remove(); }

function piperHint(text) {
  if (!state.piperOpen) togglePiper();
  pipeSay(text);
}

function pipeSay(text, delay = 600) {
  const messages = document.getElementById('piperMessages');
  if (!messages) return;
  const typing = document.createElement('div');
  typing.className = 'piper-typing';
  typing.textContent = t('piper.typing');
  messages.appendChild(typing);
  messages.scrollTop = messages.scrollHeight;

  setTimeout(() => {
    typing.remove();
    const msg = document.createElement('div');
    msg.className = 'piper-msg bot';
    msg.textContent = text;
    const say = document.createElement('button');
    say.className = 'msg-say';
    say.textContent = '🔊';
    say.title = t('piper.readThis');
    say.setAttribute('aria-label', t('piper.readThis'));
    say.onclick = () => Voice.speak(text, true);
    msg.appendChild(say);
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
    if (!state.piperOpen) { piperUnread++; updatePiperBadge(); showPeek(text); }
    Voice.speak(text);
  }, delay);
}

function addPiperUserMsg(text) {
  const messages = document.getElementById('piperMessages');
  const msg = document.createElement('div');
  msg.className = 'piper-msg user';
  msg.textContent = text;
  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
}

function addPiperOptions(options, chips) {
  const messages = document.getElementById('piperMessages');
  const wrap = document.createElement('div');
  wrap.className = 'piper-options' + (chips ? ' chips' : '');
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'piper-option-btn';
    btn.textContent = opt.text;
    btn.dataset.sfx = 'click';
    btn.onclick = () => { addPiperUserMsg(opt.text); wrap.remove(); opt.action(); };
    wrap.appendChild(btn);
  });
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
}

function sendPiperMessage() {
  const input = document.getElementById('piperInput');
  const text = input.value.trim();
  if (!text) return;
  addPiperUserMsg(text);
  input.value = '';
  setTimeout(() => respondToPiper(text), 400);
}

const topicChip = id => ({ text: libLabel(id), action: () => answerFromLibrary(id) });
const browseChip = () => ({ text: t('piper.opt.browse'), action: () => showTopicBrowser() });

// Confident match → answer (runner-up offered first among the follow-ups).
// Unsure → "Did you mean…?" chips. Nothing at all → popular topics + Browse.
function respondToPiper(text) {
  // typed "topics" / "temas" opens the topic browser (compared after stemming: temas → tema)
  if (/^(show )?(all )?(topic|browse|menu|list|tema|ver tema|ver todo lo tema|menu de tema|lista)$/.test(libTokens(text).join(' '))) { showTopicBrowser(); return; }
  const intent = coachIntent(text);
  if (intent) {
    const c = ctxCampaign();
    pipeSay(intent === 'explain' ? coachExplainResults(c) : intent === 'improve' ? coachImprove(c) : intent === 'why' ? coachWhyIterate(c) : coachNextMove(c));
    if (intent === 'why') setTimeout(() => addPiperOptions([{ text: '▶️ ' + t('coach.why'), action: () => openIterExplainer() }], true), 900);
    return;
  }
  const hits = matchLibraryAll(text);
  if (hits.length && hits[0].raw >= LIB_MIN_SCORE) {
    const second = hits[1] && hits[1].raw >= LIB_MIN_SCORE && !hits[1].e.hidden ? hits[1].e.id : null;
    answerFromLibrary(hits[0].e.id, second);
    return;
  }
  const guesses = suggestTopics(text, 3);
  if (guesses.length) {
    pipeSay(t('piper.didYouMean'));
    setTimeout(() => addPiperOptions([...guesses.map(e => topicChip(e.id)), browseChip()], true), 700);
    return;
  }
  pipeSay(t('piper.unknown'));
  setTimeout(() => addPiperOptions([...SUGGESTED_TOPICS.map(topicChip), browseChip()], true), 700);
}

function answerFromLibrary(id, alsoId) {
  const e = PIPER_LIBRARY.find(x => x.id === id);
  if (!e) return;
  pipeSay(libAnswerText(e));
  const next = [alsoId, ...e.related]
    .filter((x, i, arr) => x && x !== id && arr.indexOf(x) === i && PIPER_LIBRARY.some(p => p.id === x))
    .slice(0, 4);
  if (next.length) setTimeout(() => addPiperOptions(next.map(topicChip), true), 900);
}

function showTopicBrowser() {
  pipeSay(t('piper.topics', { n: PIPER_LIBRARY.filter(e => !e.hidden).length }));
  setTimeout(() => addPiperOptions(LIB_CATEGORIES.map(c => ({ text: catLabel(c), action: () => showCategory(c.id) })), true), 700);
}
function showCategory(catId) {
  const cat = LIB_CATEGORIES.find(c => c.id === catId);
  const items = PIPER_LIBRARY.filter(e => e.cat === catId && !e.hidden);
  pipeSay(t('piper.topicsCat', { cat: catLabel(cat), n: items.length }));
  setTimeout(() => addPiperOptions([...items.map(e => topicChip(e.id)), browseChip()], true), 700);
}

// ═══════════════════════════════════════════════════════════════════
// SCALE LAB — verdicts, account P&L, and the weekly review where the learner
// decides keep / scale / kill / clone / refresh for every campaign.
// ═══════════════════════════════════════════════════════════════════
const VERDICT_ICON = { scale: '🟢', keep: '🔵', kill: '🔴', refresh: '♻️', learning: '🟡', paused: '⏸' };
const DECISIONS = ['keep', 'up20', 'up50', 'double', 'pause', 'clone', 'refresh'];
const DECISION_ICON = { keep: '✋', up20: '📈', up50: '⏫', double: '🚀', pause: '⏸', clone: '🧬', refresh: '♻️', resume: '▶', stay: '⏸' };
const PIPER_PICK = { scale: 'up20', keep: 'keep', kill: 'pause', refresh: 'refresh', learning: 'keep' };
const PROFIT_CHALLENGE = { spend: 500, roas: SIM.targetRoas };

// How good each decision is, given Piper's read of the campaign beforehand
const GRADE = {
  scale:    { keep: 'ok',    up20: 'great', up50: 'good', double: 'warn', pause: 'bad',  clone: 'great', refresh: 'meh' },
  keep:     { keep: 'great', up20: 'ok',    up50: 'warn', double: 'bad',  pause: 'meh',  clone: 'ok',    refresh: 'good' },
  kill:     { keep: 'bad',   up20: 'bad',   up50: 'bad',  double: 'bad',  pause: 'great', clone: 'bad',  refresh: 'good' },
  refresh:  { keep: 'meh',   up20: 'warn',  up50: 'bad',  double: 'bad',  pause: 'ok',   clone: 'good',  refresh: 'great' },
  learning: { keep: 'great', up20: 'ok',    up50: 'warn', double: 'bad',  pause: 'bad',  clone: 'meh',   refresh: 'bad' },
};
const GRADE_ICON = { great: '✅', good: '👍', ok: '👌', meh: '🤔', warn: '⚠️', bad: '❌' };

const roasCls = r => (r >= SIM.targetRoas ? 'good' : r < BREAK_EVEN_ROAS ? 'bad' : '');
const fmtMoney = v => (v < 0 ? '−$' : '$') + Math.abs(Math.round(v)).toLocaleString();

function verdictVars(v) {
  const w = v.w || {};
  return { roas: (w.roas || 0).toFixed(2), be: BREAK_EVEN_ROAS.toFixed(2), target: SIM.targetRoas, freq: (w.freq || 0).toFixed(1) };
}
function verdictWhy(c) { const v = campaignVerdict(c); return t('verdict.' + v.id + '.why', verdictVars(v)); }
function verdictChip(c) {
  const v = campaignVerdict(c);
  const why = t('verdict.' + v.id + '.why', verdictVars(v));
  return `<span class="verdict v-${v.id}" title="${esc(why)}" data-say-text="${esc(t('verdict.' + v.id) + '. ' + why)}">${VERDICT_ICON[v.id]} ${t('verdict.' + v.id)}</span>`;
}

function eventLabel(ev) {
  if (!ev) return '';
  if (ev.type === 'budget') return t('ev.budget', { from: ev.from, to: ev.to });
  return t('ev.' + ev.type);
}

let weekPlan = null; // { [campaignId]: { type, audience?, headline? } }

function openWeeklyReview(preset) {
  closePopover();
  if (!state.campaigns.length) { Sfx.play('error'); pipeSay(t('wr.none')); return; }
  weekPlan = {};
  state.campaigns.forEach(c => { weekPlan[c.id] = { type: c.status === 'active' ? 'keep' : 'stay' }; });
  Object.entries(preset || {}).forEach(([id, type]) => { if (weekPlan[id]) weekPlan[id].type = type; });
  renderWeeklyReview(true);
  if (!state.player.missions.week) pipeSay(t('piper.weekOpen'));
}

function plannedSpend() {
  let perDay = 0, running = 0;
  state.campaigns.forEach(c => {
    const p = weekPlan[c.id] || {};
    const runs = (c.status === 'active' && p.type !== 'pause') || p.type === 'resume';
    if (!runs) return;
    running++;
    perDay += c.budget * ({ up20: 1.2, up50: 1.5, double: 2 }[p.type] || 1);
    if (p.type === 'clone') { perDay += c.budget; running++; }
  });
  return { running, spend: perDay * 7 };
}

function renderWeeklyReview(entering) {
  const oldBody = document.querySelector('#simpleModal .modal-body');
  const keepScroll = oldBody && document.getElementById('wrList') ? oldBody.scrollTop : 0;
  const active = state.campaigns.filter(c => c.status === 'active');
  const paused = state.campaigns.filter(c => c.status !== 'active');
  const est = plannedSpend();
  openSimpleModal('📅 ' + t('wr.title'), `
    <p class="wr-intro">${t('wr.intro', { be: BREAK_EVEN_ROAS.toFixed(2), target: SIM.targetRoas })}</p>
    ${state.prefs.guide && active.length ? `<div class="wr-picks"><button class="btn btn-secondary" id="btnPicks" onclick="usePiperPicks()" data-sfx="pop">✨ ${t('wr.usePicks')}</button><span>${t('wr.usePicksHint')}</span></div>` : ''}
    <div id="wrList">${active.map(wrCard).join('') || `<p class="wr-intro">${t('wr.allPaused')}</p>`}</div>
    ${paused.length ? `<div class="wr-section">${t('wr.paused')}</div>${paused.map(wrPausedRow).join('')}` : ''}
    <div class="wr-footer">
      <div class="wr-est">${t('wr.est', { n: est.running, spend: Math.round(est.spend).toLocaleString() })}</div>
      <button class="btn btn-success ${state.prefs.guide ? 'guide-pulse' : ''}" id="btnRunWeek" onclick="runWeek()" data-sfx="next" data-say="say.runWeek">▶ ${t('wr.run')}</button>
    </div>`, false, entering, 'wide');
  if (keepScroll) document.querySelector('#simpleModal .modal-body').scrollTop = keepScroll;
}

function wrCard(c) {
  const v = campaignVerdict(c), w = v.w || windowTotals(c, 7), plan = weekPlan[c.id];
  const pick = state.prefs.guide ? PIPER_PICK[v.id] : null;
  const stat = (label, val, cls) => `<div class="wr-stat"><span>${label}</span><b class="${cls || ''}">${val}</b></div>`;
  return `
    <div class="wr-card" id="wr-${c.id}">
      <div class="wr-head">
        <div class="wr-name">${esc(c.name)}<div class="wr-sub">${objName(c.objective)} · ${audName(c.audience)} · $${c.budget}/${t('perDayShort')} · ${t('wr.day', { n: c.days.length })}</div></div>
        ${verdictChip(c)}
      </div>
      <div class="wr-stats">
        ${stat(t('wr.spend7'), '$' + Math.round(w.spend))}
        ${stat('ROAS', w.roas.toFixed(2) + 'x', roasCls(w.roas))}
        ${stat('CPA', w.cpa ? '$' + w.cpa.toFixed(2) : '—')}
        ${stat('CTR', w.ctr.toFixed(2) + '%')}
        ${stat(t('col.freq'), w.freq.toFixed(1), w.freq >= 3 ? 'bad' : '')}
      </div>
      <div class="wr-why">🐱 ${t('verdict.' + v.id + '.why', verdictVars(v))}</div>
      <div class="dec-row" role="radiogroup" aria-label="${esc(t('wr.decide', { name: c.name }))}">
        ${DECISIONS.map(d => `<button class="dec-btn ${plan.type === d ? 'on' : ''} ${pick === d ? 'pick' : ''}" role="radio" aria-checked="${plan.type === d}" onclick="setDecision('${c.id}','${d}')" data-sfx="click" title="${esc(t('wr.decd.' + d))}" data-say-text="${esc(t('wr.dec.' + d) + '. ' + t('wr.decd.' + d))}">${DECISION_ICON[d]} ${t('wr.dec.' + d)}</button>`).join('')}
      </div>
      ${pick ? `<div class="wr-pick-note">✨ ${t('wr.pickNote', { d: t('wr.dec.' + pick) })}</div>` : ''}
      ${plan.type === 'clone' ? cloneOptions(c, plan) : ''}
      ${plan.type === 'refresh' ? refreshOptions(c, plan) : ''}
    </div>`;
}

// Default place to copy a winner: a lookalike, else the broad audience
function defaultCloneAudience(c) {
  const options = AUDIENCES.filter(a => a.id !== c.audience);
  return (options.find(a => a.id === 'lookalike') || options.find(a => a.id === 'broad') || options[0]).id;
}

function cloneOptions(c, plan) {
  const options = AUDIENCES.filter(a => a.id !== c.audience);
  if (!plan.audience) plan.audience = defaultCloneAudience(c);
  return `
    <div class="wr-extra">
      <div class="form-label">${t('wr.cloneTo')}</div>
      <div class="dec-row">${options.map(a => `<button class="dec-btn small ${plan.audience === a.id ? 'on' : ''}" onclick="weekPlan['${c.id}'].audience='${a.id}'; renderWeeklyReview()" data-sfx="click">${t('aud.' + a.id)}</button>`).join('')}</div>
      <div class="form-hint">${t('wr.cloneHint', { budget: c.budget })}</div>
    </div>`;
}

function refreshOptions(c, plan) {
  if (plan.headline === undefined) plan.headline = '';
  return `
    <div class="wr-extra">
      <label class="form-label" for="wrh-${c.id}">${t('wr.newHeadline')}</label>
      <input type="text" id="wrh-${c.id}" maxlength="40" value="${esc(plan.headline)}" placeholder="${esc(t('wr.newHeadlinePh'))}" oninput="weekPlan['${c.id}'].headline=this.value">
      <div class="form-hint">${t('wr.currentHeadline', { h: esc(c.creative.headline) })}</div>
    </div>`;
}

function wrPausedRow(c) {
  const plan = weekPlan[c.id];
  return `
    <div class="wr-card paused">
      <div class="wr-head">
        <div class="wr-name">${esc(c.name)}<div class="wr-sub">${t('wr.pausedSub', { roas: windowTotals(c, 7).roas.toFixed(2) })}</div></div>
        <div class="dec-row">
          ${['stay', 'resume'].map(d => `<button class="dec-btn small ${plan.type === d ? 'on' : ''}" onclick="setDecision('${c.id}','${d}')" data-sfx="click" title="${esc(t('wr.decd.' + d))}">${DECISION_ICON[d]} ${t('wr.dec.' + d)}</button>`).join('')}
        </div>
      </div>
    </div>`;
}

function setDecision(id, type) { weekPlan[id].type = type; renderWeeklyReview(); }

// Beginner shortcut: apply Piper's pick to every running ad (a tired ad gets a ready-made fresh headline)
function usePiperPicks() {
  state.campaigns.filter(c => c.status === 'active').forEach(c => {
    const pick = PIPER_PICK[campaignVerdict(c).id]; if (!pick) return;
    weekPlan[c.id] = { type: pick };
    if (pick === 'refresh') weekPlan[c.id].headline = freshHeadlineFor(c);
  });
  renderWeeklyReview();
  pipeSay(t('piper.picksUsed'));
}
function freshHeadlineFor(c) {
  const lib = c.creative.libId || 'generic', cur = String(c.creative.headline).trim().toLowerCase();
  for (let i = 1; i <= 3; i++) { const h = t('ideas.' + lib + '.' + i); if (h.toLowerCase() !== cur) return h; }
  return t('ideas.generic.1');
}

// ── Run the week ──────────────────────────────────────────────────
function runWeek() {
  for (const c of state.campaigns) {
    const p = weekPlan[c.id];
    if (p && p.type === 'refresh') {
      const h = (p.headline || '').trim();
      if (!h || h.toLowerCase() === String(c.creative.headline).trim().toLowerCase()) {
        Sfx.play('error'); pipeSay(t('wr.needHeadline', { name: c.name }));
        const input = document.getElementById('wrh-' + c.id); if (input) input.focus();
        return;
      }
    }
  }

  const ranBefore = state.campaigns.filter(c => c.status === 'active');
  const before = sumWindows(ranBefore);
  const rows = [], created = [];

  state.campaigns.slice().forEach(c => {
    const p = weekPlan[c.id] || { type: c.status === 'active' ? 'keep' : 'stay' };
    if (p.type === 'stay') { c.sim.pausedWeeks = (c.sim.pausedWeeks || 0) + 1; return; }
    const v = campaignVerdict(c), prev = windowTotals(c, 7);
    const row = { c, type: p.type, verdict: v.id, prevRoas: prev.roas, prevDays: prev.days, prevBudget: c.budget };
    if (p.type === 'up20') simChangeBudget(c, c.budget * 1.2);
    if (p.type === 'up50') simChangeBudget(c, c.budget * 1.5);
    if (p.type === 'double') simChangeBudget(c, c.budget * 2);
    if (p.type === 'pause') { c.status = 'paused'; c.sim.pausedWeeks = 1; }
    if (p.type === 'resume') simResume(c);
    if (p.type === 'refresh') simRefresh(c, p.headline.trim());
    if (p.type === 'clone') {
      const aud = p.audience && p.audience !== c.audience ? p.audience : defaultCloneAudience(c);
      const k = newCampaign({ name: `${c.name} → ${t('aud.' + aud)}`, objective: c.objective, audience: aud,
        placements: c.placements, budget: c.budget, creative: c.creative, clonedFrom: c.id }, null, 0);
      created.push(k); row.clone = k;
    }
    rows.push(row);
  });
  created.forEach(k => state.campaigns.unshift(k));
  state.campaigns.forEach(c => { if (c.status === 'active') simRun(c, 7); });

  const after = sumWindows(state.campaigns.filter(c => c.status === 'active'));
  rows.forEach(r => {
    r.grade = r.type === 'resume' ? 'ok' : (GRADE[r.verdict] || GRADE.keep)[r.type] || 'ok';
    r.now = r.c.status === 'active' ? windowTotals(r.c, 7) : null;
  });

  // Missions, badges, XP
  const m = state.player.missions, xp = [];
  if (!m.week) { m.week = true; xp.push([50, 'xp.week']); }
  rows.forEach(r => {
    const profitable = r.prevDays >= 7 && r.prevRoas >= BREAK_EVEN_ROAS;
    if (['up20', 'up50', 'double'].includes(r.type) && profitable && !m.scaled) { m.scaled = true; xp.push([50, 'xp.scaled']); }
    if (r.type === 'pause' && r.verdict === 'kill' && !m.killed) { m.killed = true; xp.push([50, 'xp.killed']); earnBadge('ruthless'); }
    if (r.type === 'clone' && profitable && !m.cloned) { m.cloned = true; xp.push([75, 'xp.cloned']); earnBadge('cloner'); }
    if (r.type === 'refresh' && !m.refreshed) { m.refreshed = true; xp.push([50, 'xp.refreshed']); earnBadge('fresh'); }
  });
  const goodCalls = rows.filter(r => r.grade === 'great' || r.grade === 'good').length;
  if (goodCalls) xp.push([Math.min(40, goodCalls * 10), 'xp.goodCalls', { n: goodCalls }]);
  const challenge = !m.profit && after.spend >= PROFIT_CHALLENGE.spend && after.roas >= PROFIT_CHALLENGE.roas;
  if (challenge) { m.profit = true; xp.push([150, 'xp.profit']); earnBadge('profit'); }

  closeSimpleModal(); saveState(); render();
  Sfx.play('success');
  if (challenge) showConfetti();
  if (challenge) { pipeReact('celebrate'); coinRain(); }
  else if (after.spend > 0 && after.profit < 0) { pipeReact('panic'); moneyFly(); }
  else if (rows.length && goodCalls === rows.length) { pipeReact('celebrate'); if (after.profit > before.profit) coinRain(); }
  else if (rows.some(r => r.grade === 'bad')) pipeReact('grumpy');
  if (rows.length) markDecided();
  xp.forEach(([n, key, vars], i) => setTimeout(() => awardXP(n, key, vars), i * 450));
  showWeekReport(rows, before, after, challenge);
}

function sumWindows(list) {
  const t2 = list.reduce((a, c) => { const w = windowTotals(c, 7); a.spend += w.spend; a.revenue += w.revenue; a.conversions += w.conversions; return a; },
    { spend: 0, revenue: 0, conversions: 0 });
  t2.roas = t2.spend ? t2.revenue / t2.spend : 0;
  t2.profit = t2.revenue * SIM.margin - t2.spend;
  return t2;
}

function coachLine(r) {
  const key = `coach.${r.verdict}.${r.type}`;
  const vars = { name: esc(r.c.name), budget: r.c.budget, prev: r.prevBudget, aud: r.clone ? t('aud.' + r.clone.audience) : '' };
  return LANG_EN[key] !== undefined ? t(key, vars) : t('coach.g.' + r.grade, vars);
}

function showWeekReport(rows, before, after, challenge) {
  const kpi = (label, now, prev, fmt, upIsGood) => {
    const diff = now - prev, better = upIsGood ? diff >= 0 : diff <= 0;
    const tone = !prev || upIsGood === null ? '' : better ? 'good' : 'bad'; // spend is neither good nor bad by itself
    return `<div class="wk-kpi"><span>${label}</span><b>${fmt(now)}</b><small class="${tone}">${prev ? (diff >= 0 ? '▲' : '▼') + ' ' + t('wrep.vsPrev', { v: fmt(prev) }) : t('wrep.firstWeek')}</small></div>`;
  };
  const roasFmt = v => v.toFixed(2) + 'x';
  const prog = Math.min(100, Math.round(after.spend / PROFIT_CHALLENGE.spend * 100));
  const goodCalls = rows.filter(r => r.grade === 'great' || r.grade === 'good').length;
  openSimpleModal('📊 ' + t('wrep.title'), `
    <div class="wk-kpis">
      ${kpi(t('pnl.spend'), after.spend, before.spend, fmtMoney, null)}
      ${kpi(t('pnl.revenue'), after.revenue, before.revenue, fmtMoney, true)}
      ${kpi('ROAS', after.roas, before.roas, roasFmt, true)}
      ${kpi(t('pnl.profit'), after.profit, before.profit, fmtMoney, true)}
    </div>
    ${challenge ? `<div class="winner-banner">🏆 ${t('wrep.challengeDone')}</div>` : state.player.missions.profit ? '' : `
      <div class="wk-challenge">
        <div><b>🎯 ${t('wrep.challenge', { spend: PROFIT_CHALLENGE.spend, roas: PROFIT_CHALLENGE.roas })}</b></div>
        <div class="wk-prog"><div style="width:${prog}%"></div></div>
        <div class="form-hint">${t('wrep.challengeNow', { spend: Math.round(after.spend), roas: after.roas.toFixed(2) })}</div>
      </div>`}
    <div class="wr-section">${t('wrep.decisions', { good: goodCalls, total: rows.length })}</div>
    ${rows.map(r => `
      <div class="wk-row g-${r.grade}">
        <div class="wk-icon">${GRADE_ICON[r.grade]}</div>
        <div class="wk-main">
          <div class="wk-title"><b>${esc(r.c.name)}</b> · ${DECISION_ICON[r.type]} ${t('wr.dec.' + r.type)}
            ${r.now ? `<span class="wk-roas">ROAS ${r.prevDays ? r.prevRoas.toFixed(2) + 'x → ' : ''}<b class="${roasCls(r.now.roas)}">${r.now.roas.toFixed(2)}x</b></span>` : ''}</div>
          <div class="wk-coach">${coachLine(r)}</div>
          ${r.clone ? `<div class="wk-coach">🧬 ${t('wrep.cloneNote', { name: esc(r.clone.name), roas: windowTotals(r.clone, 7).roas.toFixed(2) })}</div>` : ''}
        </div>
      </div>`).join('')}
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap;">
      <button class="btn btn-secondary" onclick="closeSimpleModal(); render()">${t('close')}</button>
      <button class="btn btn-primary" onclick="openWeeklyReview()" data-sfx="pop">📅 ${t('wrep.again')}</button>
    </div>`, false, true, 'wide');
  pipeSay(t('piper.weekDone', { roas: after.roas.toFixed(2), profit: fmtMoney(after.profit), good: goodCalls, total: rows.length }));
}


// ─── journey.js ───
// ═══════════════════════════════════════════════════════════════════
// THE JOURNEY — Piper's coach card walks the learner through the whole
// media-buying loop, one step and one button at a time:
// Launch → Measure → Decide → Improve → again.
// ═══════════════════════════════════════════════════════════════════
const LOOP = ['launch', 'measure', 'decide', 'improve'];

// phase = which part of the loop this step belongs to (1–4); mission = the spotlight entry in MISSIONS
const JOURNEY = [
  { id: 'launch',     phase: 1, xp: 75,  mission: 'launch',     done: p => !!p.missions.firstLaunch, go: 'openCreate()' },
  { id: 'results',    phase: 2, xp: 25,  mission: 'results',    done: p => !!p.missions.firstDetail, go: 'openLatest()' },
  { id: 'decide',     phase: 3, xp: 50,  mission: 'decide',     done: p => !!p.missions.decided,     go: 'openLatestVerdict()', extras: ['guide', 'why'] },
  { id: 'loser',      phase: 3, xp: 50,  mission: 'kill',       done: p => !!p.missions.killed,      go: 'goLoser()', extras: ['guide'] },
  { id: 'abtest',     phase: 4, xp: 100, mission: 'abtest',     done: p => p.badges.includes('lab'),  go: 'goABTest()' },
  { id: 'week',       phase: 2, xp: 50,  mission: 'week',       done: p => !!p.missions.week,        go: 'openWeeklyReview()' },
  { id: 'scale',      phase: 4, xp: 50,  mission: 'scale',      done: p => !!p.missions.scaled,      go: 'goScale()' },
  { id: 'horizontal', phase: 4, xp: 75,  mission: 'horizontal', done: p => !!p.missions.cloned,      go: 'goClone()' },
  { id: 'refresh',    phase: 4, xp: 50,  mission: 'refresh',    done: p => !!p.missions.refreshed,   go: 'goRefresh()' },
  { id: 'profit',     phase: 4, xp: 150, mission: 'profit',     done: p => !!p.missions.profit,      go: 'openWeeklyReview()' },
  { id: 'deck',       phase: 2, xp: 75,  mission: 'deck',       done: p => p.badges.includes('deck'), go: 'goDeck()' },
];
const JOURNEY_EXTRAS = [
  { id: 'bulk',     mission: 'bulk',     done: p => p.badges.includes('bulk'), go: 'openBulkUpload()' },
  { id: 'research', mission: 'research', done: p => !!p.missions.adLibrary,   go: 'startAdLibraryMission()' },
];

function currentStep() { return JOURNEY.find(s => !s.done(state.player)) || null; }
function stepIndex(step) { return JOURNEY.indexOf(step) + 1; }

// Beginners see the full card; experienced learners start with the compact one. Either can toggle.
function coachExpanded() {
  if (state.prefs.coachOpen === true || state.prefs.coachOpen === false) return state.prefs.coachOpen;
  return state.player.track !== 'expert' && state.player.track !== 'intermediate';
}
function toggleCoach() { state.prefs.coachOpen = !coachExpanded(); saveState(); render(); }

function loopMiniHTML(active) {
  return '<div class="loop-mini" aria-hidden="true">' + LOOP.map((k, i) => {
    const n = i + 1, cls = n === active ? 'active' : n < active ? 'done' : '';
    const icon = ['🚀', '📊', '🧭', '📈'][i];
    const arrow = i < 3 ? '<div class="loop-arrow">→</div>' : `<div class="loop-arrow" title="${t('loop.again')}">↻</div>`;
    return `<div class="loop-node ${cls}"><span>${icon}</span>${t('loop.' + k)}</div>${arrow}`;
  }).join('') + '</div>';
}

function renderCoachCard() {
  const step = currentStep();
  const face = `<img class="pc-cat" src="${PIPER_IMG.face}" alt="Piper">`;
  if (!step) {
    const left = JOURNEY_EXTRAS.filter(x => !x.done(state.player));
    return `
      <div class="piper-coach mini done" id="piperCoach">
        <div class="pc-top">${face}
          <div class="pc-head"><div class="pc-step">${t('coach.done.title')}</div><div class="pc-body-inline">${t('coach.done.body')}</div></div>
        </div>
        <div class="pc-cta">
          ${left.map(x => `<button class="btn btn-secondary" onclick="${x.go}" data-sfx="pop">${t('j.' + x.id + '.go')}</button>`).join('')}
          <button class="btn btn-secondary" onclick="openDecisionGuide()" data-sfx="click">🧭 ${t('coach.guide')}</button>
        </div>
      </div>`;
  }
  const n = stepIndex(step), total = JOURNEY.length, open = coachExpanded();
  const primary = `<button class="btn btn-primary ${state.prefs.guide ? 'guide-pulse' : ''}" id="coachGo" onclick="${step.go}" data-sfx="pop" data-say-text="${esc(t('j.' + step.id + '.go'))}">${t('j.' + step.id + '.go')}</button>`;
  const extras = (step.extras || []).map(x => x === 'guide'
    ? `<button class="btn btn-secondary" onclick="openDecisionGuide()" data-sfx="click">🧭 ${t('coach.guide')}</button>`
    : `<button class="btn btn-secondary" onclick="openIterExplainer()" data-sfx="click">▶️ ${t('coach.why')}</button>`).join('');
  const toggle = `<button class="pc-toggle" onclick="toggleCoach()" aria-expanded="${open}" aria-label="${open ? t('coach.hide') : t('coach.show')}" title="${open ? t('coach.hide') : t('coach.show')}">${open ? '▴' : '▾'}</button>`;
  if (!open) return `
    <div class="piper-coach mini" id="piperCoach" data-say-text="${esc(t('coach.stepOf', { n, total }) + '. ' + t('j.' + step.id + '.title'))}">
      <div class="pc-top">${face}
        <div class="pc-head"><div class="pc-step">${t('coach.stepOf', { n, total })} <span class="mission-xp">+${step.xp} XP</span></div><div class="pc-title">${t('j.' + step.id + '.title')}</div></div>
        <div class="pc-cta">${primary}</div>${toggle}
      </div>
    </div>`;
  return `
    <div class="piper-coach" id="piperCoach" data-say-text="${esc(t('coach.stepOf', { n, total }) + '. ' + t('j.' + step.id + '.title') + '. ' + t('j.' + step.id + '.body').replace(/<[^>]+>/g, ''))}">
      <div class="pc-top">${face}
        <div class="pc-head"><div class="pc-step">${t('coach.stepOf', { n, total })} <span class="mission-xp">+${step.xp} XP</span></div><div class="pc-title">${t('j.' + step.id + '.title')}</div></div>
        ${toggle}
      </div>
      <div class="pc-body">${t('j.' + step.id + '.body')}</div>
      ${loopMiniHTML(step.phase)}
      <div class="pc-cta">${primary}<button class="btn btn-secondary" id="btnShowMe" onclick="showMeMission('${step.mission}')" data-sfx="click" data-say="say.showMe">👀 ${t('mission.showMe')}</button>${extras}</div>
    </div>`;
}

function isBeginner() { return !state.player.track || state.player.track === 'beginner'; }

function journeyMapHTML() {
  const cur = currentStep();
  return `<ol class="jmap">${JOURNEY.map((s, i) => `<li class="${s.done(state.player) ? 'done' : s === cur ? 'cur' : ''}"><span class="jm-n">${s.done(state.player) ? '✓' : i + 1}</span>${t('j.' + s.id + '.title')}</li>`).join('')}</ol>`;
}

// Short "Piper teaches" box at the top of each Create step (beginners, or anyone with Guide on)
function stepLessonHTML() {
  if (!isBeginner()) return '';
  const k = STEPS[state.createStep];

function markDecided() {
  if (state.player.missions.decided) return;
  state.player.missions.decided = true;
  saveState(); render(); // move Piper's card to the next step right away
  awardXP(50, 'xp.decided');
}

function verdictAction(id) {
  const c = state.campaigns.find(x => x.id === id); if (!c) return;
  const v = campaignVerdict(c).id;
  markDecided();
  if (v === 'scale') openWeeklyReview({ [id]: 'up20' });
  else if (v === 'keep') { openABTest(id); if (abDraft) { abDraft.variable = 'headline'; renderABSetup(); } pipeSay(t('piper.abCoach')); }
  else if (v === 'kill') pauseCampaign(id, true);
  else if (v === 'refresh') openWeeklyReview({ [id]: 'refresh' });
  else if (v === 'learning') { piperHint(t('piper.waitLearning')); openWeeklyReview(); }
  else if (v === 'paused') toggleCampaign(id);
}

// Pausing a loser is a skill: celebrate it, whatever button it came from
function pauseCampaign(id, fromVerdict) {
  const c = state.campaigns.find(x => x.id === id); if (!c || c.status !== 'active') return;
  const wasKill = campaignVerdict(c).id === 'kill';
  c.status = 'paused'; c.sim.pausedWeeks = 1;
  saveState(); render();
  Sfx.play('click');
  if (wasKill) {
    pipeReact('coach');
    if (!state.player.missions.killed) { state.player.missions.killed = true; saveState(); awardXP(50, 'xp.killed'); earnBadge('ruthless'); }
    markDecided();
    pipeSay(t('piper.loserPaused', { name: c.name }));
    render();
  } else if (fromVerdict) pipeSay(t('piper.pausedOk'));
}

// ── Headline coach (Ad creative step): live checklist + ideas ──────
function headlineChecks(h, body) {
  const s = String(h || '').trim(), all = s + ' ' + String(body || '');
  return [
    { id: 'hook',     ok: /^(\d|¿|tired|stop|finally|pov|why|how|what|your|still|imagine|meet|say|get|try|save|free|new|discover|cansad|deja|por fin|por qu|c[oó]mo|qu[eé]|tu |tus |todav[ií]a|imagina|conoce|dile|ahorra|prueba|gratis|nuev|descubre|consigue|ponte|clase gratis)/i.test(s) || /\?/.test(s) },
    { id: 'specific', ok: /\d/.test(s) },
    { id: 'benefit',  ok: /(free|save|off\b|%|ship|fresh|fast|easy|minute|day|week|bundle|deliver|love|crazy|stick|slump|gratis|ahorra|descuento|env[ií]o|fresc|r[aá]pid|f[aá]cil|minuto|d[ií]a|semana|aman|encanta)/i.test(s) },
    { id: 'you',      ok: /\b(you|your|tu|tus|te)\b/i.test(all) },
    { id: 'length',   ok: s.length >= 8 && s.length <= 40 },
  ];
}
function headlineCoachHTML() {
  const d = state.draft, checks = headlineChecks(d.creative.headline, d.creative.body);
  const score = checks.filter(c => c.ok).length;
  const stars = '★'.repeat(score) + '☆'.repeat(5 - score);
  return `
    <div class="hc-head"><span>${t('hc.title')}</span><b class="hc-stars s${score}">${stars}</b></div>
    <ul class="hc-list">${checks.map(c => `<li class="${c.ok ? 'ok' : ''}">${c.ok ? '✓' : '○'} ${t('hc.' + c.id)}</li>`).join('')}</ul>
    <div class="hc-ideas"><button class="link-btn" onclick="showHeadlineIdeas()" data-sfx="click">💡 ${t('hc.ideas')}</button></div>`;
}

function showHeadlineIdeas() {

// ── Piper reads YOUR numbers (data-aware coaching) ─────────────────
function ctxCampaign() {
  if (state.view === 'detail' && state.selectedCampaignId) { const c = state.campaigns.find(x => x.id === state.selectedCampaignId); if (c) return c; }
  return latestCampaign();
}
function coachVars(c) {
  const tt = c.totals, v = campaignVerdict(c), w = windowTotals(c, 7);
  return { name: c.name, imp: tt.impressions.toLocaleString(), clicks: tt.clicks.toLocaleString(), ctr: tt.ctr, per100: Math.max(1, Math.round(Number(tt.ctr))),
           cpa: tt.cpa, roas: tt.roas, roas7: w.roas.toFixed(2), freq: tt.freq, verdict: t('verdict.' + v.id), be: BREAK_EVEN_ROAS.toFixed(2), vid: v.id,
           headline: t('verdict.' + v.id + '.headline'), move: t('verdict.' + v.id + '.move') };
}
function coachExplainResults(c) {
  if (!c) return t('cx.none');
  const v = coachVars(c), ctr = Number(c.totals.ctr), roas = Number(c.totals.roas);
  return t('cx.explain.1', v) + ' ' + t(ctr >= 1.2 ? 'cx.explain.ctrGood' : 'cx.explain.ctrLow', v) + ' '
    + (c.totals.cpa !== '—' ? t('cx.explain.cpa', v) + ' ' : '')
    + t(roas >= SIM.targetRoas ? 'cx.explain.roasGreat' : roas >= BREAK_EVEN_ROAS ? 'cx.explain.roasThin' : 'cx.explain.roasLoss', v) + ' '
    + t('cx.explain.bottom', v);
}
function coachImprove(c) {
  if (!c) return t('cx.none');
  const v = coachVars(c), ctr = Number(c.totals.ctr), roas = Number(c.totals.roas), cpa = c.totals.cpa === '—' ? null : Number(c.totals.cpa);
  if (ctr < 0.9) return t('cx.improve.ctr', v);
  if (c.totals.freq >= 3) return t('cx.improve.freq', v);
  if (cpa !== null && cpa > 40) return t('cx.improve.cpa', v);
  if (roas < BREAK_EVEN_ROAS) return t('cx.improve.loss', v);
  if (roas >= SIM.targetRoas) return t('cx.improve.winner', v);
  return t('cx.improve.middle', v);
}
function coachWhyIterate(c) { return t('cx.why') + (c ? ' ' + t('cx.why.yours', coachVars(c)) : ''); }
function coachNextMove(c) { return c ? t('cx.next', coachVars(c)) : t('cx.none'); }

function piperContextChips() {
  return [
    { text: t('cc.explain'), action: () => pipeSay(coachExplainResults(ctxCampaign())) },
    { text: t('cc.improve'), action: () => pipeSay(coachImprove(ctxCampaign())) },
    { text: t('cc.why'), action: () => { pipeSay(coachWhyIterate(ctxCampaign())); setTimeout(() => addPiperOptions([{ text: '▶️ ' + t('coach.why'), action: () => openIterExplainer() }], true), 900); } },
    { text: t('cc.next'), action: () => pipeSay(coachNextMove(ctxCampaign())) },
  ];
}
// Typed questions that should get Piper's data-aware answer instead of a library article
function coachIntent(text) {
  const q = ' ' + libTokens(text).join(' ') + ' ';
  const has = re => re.test(q);
  if (has(/ (explain|read) .*(result|number|data|campaign)| what happened | how did (it|my) | explica|expl[ií]ca|lee .*(resultado|numero|dato)| que paso | como le fue /)) return 'explain';
  if (has(/ improve | make .*better | do better | fix (my|this|it) | mejor(ar|o) | arregl/)) return 'improve';
  if (has(/ why .*(iterat|chang|test|edit|tweak)| point of | leave it | por que .*(cambi|prob|iter)| para que cambiar | dejarlo asi /)) return 'why';
  if (has(/ what (should|do) i do | next (step|move) | now what | what would you do | que (hago|sigue|debo hacer) | siguiente paso | que harias /)) return 'next';
  return null;
}

  endTour(true);
  closePopover();
  if (state.view !== 'campaigns') { state.view = 'campaigns'; render(); }
  tour = { steps, i: 0, onDone, els: {}, actionCleanup: null };
  ['top', 'left', 'right', 'bottom'].forEach(side => {
    const d = document.createElement('div');
    d.className = 'spot-shade';
    d.addEventListener('click', () => { const c = tour && tour.els.card; if (c) { c.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.03)' }, { transform: 'scale(1)' }], { duration: 220 }); } });
    document.body.appendChild(d);
    tour.els[side] = d;
  });
  tour.els.ring = Object.assign(document.createElement('div'), { className: 'spot-ring' });
  tour.els.card = Object.assign(document.createElement('div'), { className: 'coach-card' });
  tour.els.card.setAttribute('role', 'dialog');
  tour.els.card.setAttribute('aria-live', 'polite');
  document.body.appendChild(tour.els.ring);
  document.body.appendChild(tour.els.card);
  window.addEventListener('resize', positionSpot);
  window.addEventListener('scroll', positionSpot, true);
  showTourStep();
  setTimeout(() => { if (tour) Object.values(tour.els).forEach(el => el.classList.add('ready')); }, 60);
}

function tourTarget(step) {
  if (!step.target) return null;
  const el = document.querySelector(step.target);
  return el && el.getClientRects().length ? el : null;
}

function showTourStep() {
  if (!tour) return;
  if (tour.actionCleanup) { tour.actionCleanup(); tour.actionCleanup = null; }
  const step = tour.steps[tour.i], total = tour.steps.length, last = tour.i === total - 1;
  const target = tourTarget(step);
  if (target) target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  const title = t(step.k + '.title'), body = t(step.k + '.body');
  tour.els.card.innerHTML = `
    <div class="coach-head">
      <div class="coach-avatar">🐱</div>
      <div>${total > 1 ? `<div class="coach-step">${t('tour.stepOf', { n: tour.i + 1, total })}</div>` : ''}<div class="coach-title">${title}</div></div>
      <button class="coach-say" onclick="Voice.speak(${esc(JSON.stringify(title + '. ' + body))}, true)" aria-label="${t('piper.readThis')}" title="${t('piper.readThis')}">🔊</button>
    </div>
    <div class="coach-body">${body}</div>
    ${step.action ? `<div class="coach-tip">👆 ${t('tour.clickIt')}</div>` : ''}
    <div class="coach-foot">
      <div class="coach-dots" aria-hidden="true">${total > 1 ? tour.steps.map((s, i) => `<i class="${i === tour.i ? 'on' : ''}"></i>`).join('') : ''}</div>
      <div class="coach-btns">
        ${step.action
          ? `<button class="link-btn" onclick="endTour()">${t('tour.notNow')}</button>`
          : `${!last ? `<button class="link-btn" onclick="endTour()">${t('tour.skip')}</button>` : ''}
             ${tour.i > 0 ? `<button class="btn btn-secondary" onclick="tourGo(-1)" data-sfx="click">${t('back')}</button>` : ''}
             <button class="btn btn-primary" id="tourNext" onclick="tourGo(1)">${last ? t('tour.done') : t('next') + ' →'}</button>`}
      </div>
    </div>`;
  if (step.action && target) {
    const handler = () => { setTimeout(() => endTour(true), 0); };
    target.addEventListener('click', handler, { once: true });
    tour.actionCleanup = () => target.removeEventListener('click', handler);
  }
  positionSpot();
  Sfx.play('tour');
  Voice.speak(title + '. ' + body);
  const next = document.getElementById('tourNext');
  if (next) next.focus({ preventScroll: true });
}

function tourGo(dir) {
  if (!tour) return;
  const ni = tour.i + dir;
  if (ni >= tour.steps.length) { Sfx.play('next'); endTour(); return; }
  if (ni < 0) return;
  tour.i = ni;
  showTourStep();
}

function endTour(silent) {
  if (!tour) return;
  const done = tour.onDone;
  if (tour.actionCleanup) tour.actionCleanup();
  Object.values(tour.els).forEach(el => el.remove());
  window.removeEventListener('resize', positionSpot);
  window.removeEventListener('scroll', positionSpot, true);
  tour = null;
  Voice.stop();
  if (!silent && done) done();
}

function positionSpot() {
  if (!tour) return;
  const step = tour.steps[tour.i];
  const target = tourTarget(step);
  const W = window.innerWidth, H = window.innerHeight, m = 16;
  const pad = step.pad !== undefined ? step.pad : 6;
  let r;
  if (target) {
    const b = target.getBoundingClientRect();
    const x = Math.max(0, b.left - pad), y = Math.max(0, b.top - pad);
    r = { x, y, w: Math.min(W, b.right + pad) - x, h: Math.min(H, b.bottom + pad) - y };
  } else {
    r = { x: W / 2, y: H / 2, w: 0, h: 0 };
  }
  const { top, left, right, bottom, ring, card } = tour.els;
  const px = v => Math.max(0, v) + 'px';
  Object.assign(top.style, { left: '0px', top: '0px', width: W + 'px', height: px(r.y) });
  Object.assign(bottom.style, { left: '0px', top: px(r.y + r.h), width: W + 'px', height: px(H - (r.y + r.h)) });
  Object.assign(left.style, { left: '0px', top: px(r.y), width: px(r.x), height: px(r.h) });
  Object.assign(right.style, { left: px(r.x + r.w), top: px(r.y), width: px(W - (r.x + r.w)), height: px(r.h) });
  ring.style.display = r.w ? 'block' : 'none';
  Object.assign(ring.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });

  // Coach card: below the target if it fits, else above, else beside, else inside the bottom edge.
  const cw = card.offsetWidth, ch = card.offsetHeight, gap = 14;
  let cx, cy;
  if (!r.w) { cx = (W - cw) / 2; cy = (H - ch) / 2; }
  else if (r.y + r.h + gap + ch <= H - m) { cy = r.y + r.h + gap; cx = r.x + r.w / 2 - cw / 2; }
  else if (r.y - gap - ch >= m) { cy = r.y - gap - ch; cx = r.x + r.w / 2 - cw / 2; }
  else if (r.x + r.w + gap + cw <= W - m) { cx = r.x + r.w + gap; cy = r.y + r.h / 2 - ch / 2; }
  else if (r.x - gap - cw >= m) { cx = r.x - gap - cw; cy = r.y + r.h / 2 - ch / 2; }
  else { cx = (W - cw) / 2; cy = Math.min(H - ch - m, r.y + r.h - ch - m); }
  card.style.left = Math.max(m, Math.min(W - cw - m, cx)) + 'px';
  card.style.top = Math.max(m, Math.min(H - ch - m, cy)) + 'px';
}

// ═══════════════════════════════════════════════════════════════════
// MISSIONS — always one clear "next thing to do", with a Show me spotlight
// ═══════════════════════════════════════════════════════════════════
// target = what "Show me" spotlights; glow = the passive highlight on each screen.
// The middle missions are the scaling journey: weekly review → scale → kill → horizontal → refresh → profit.
const MISSIONS = [
  { id: 'launch',     xp: 75,  done: p => !!p.missions.firstLaunch, view: 'campaigns', target: '#btnCreate',
    glow: { campaigns: '#btnCreateEmpty, #btnCreate' } },
  { id: 'results',    xp: 25,  done: p => !!p.missions.firstDetail, view: 'campaigns', tab: 'campaigns', target: '#tableArea tbody tr:first-child .campaign-name',
    glow: { campaigns: '#tableArea tbody tr:first-child .campaign-name' } },
  { id: 'decide',     xp: 50,  done: p => !!p.missions.decided,     view: 'detail', target: '#verdictCta',
    glow: { campaigns: '#tableArea tbody tr:first-child .campaign-name', detail: '#verdictCta' } },
  { id: 'abtest',     xp: 100, done: p => p.badges.includes('lab'),  view: 'detail', target: '#btnABThis',
    glow: { campaigns: '#btnAB', detail: '#btnABThis' } },
  { id: 'week',       xp: 50,  done: p => !!p.missions.week,       view: 'campaigns', target: '#btnWeek', glow: { campaigns: '#btnWeek', detail: '#btnWeekDetail' } },
  { id: 'scale',      xp: 50,  done: p => !!p.missions.scaled,     view: 'campaigns', target: '#btnWeek', glow: { campaigns: '#btnWeek', detail: '#btnWeekDetail' } },
  { id: 'kill',       xp: 50,  done: p => !!p.missions.killed,     view: 'campaigns', target: '#btnWeek', glow: { campaigns: '#btnWeek', detail: '#btnWeekDetail' } },
  { id: 'deck',       xp: 75,  done: p => p.badges.includes('deck'), view: 'detail', target: '#btnDeck',
    glow: { campaigns: '#tableArea tbody tr:first-child .campaign-name', detail: '#btnDeck' } },
  { id: 'horizontal', xp: 75,  done: p => !!p.missions.cloned,     view: 'campaigns', target: '#btnWeek', glow: { campaigns: '#btnWeek', detail: '#btnWeekDetail' } },
  { id: 'refresh',    xp: 50,  done: p => !!p.missions.refreshed,  view: 'campaigns', target: '#btnWeek', glow: { campaigns: '#btnWeek', detail: '#btnWeekDetail' } },
  { id: 'profit',     xp: 150, done: p => !!p.missions.profit,     view: 'campaigns', target: '#btnWeek', glow: { campaigns: '#btnWeek', detail: '#btnWeekDetail' } },
  { id: 'bulk',       xp: 50,  done: p => p.badges.includes('bulk'), view: 'campaigns', target: '#btnBulk', glow: { campaigns: '#btnBulk' } },
  { id: 'research',   xp: 50,  done: p => !!p.missions.adLibrary,  view: 'campaigns', target: '#btnLibrary', glow: { campaigns: '#btnLibrary' } },
];

// The journey (journey.js) decides which step is current; MISSIONS holds where to point for it.
function currentMission() { const s = currentStep(); return s ? MISSIONS.find(m => m.id === s.mission) : null; }
function renderMissionBar() { return renderCoachCard(); }

// Puts the app on the right screen for the mission, then spotlights the thing to click.
function showMeMission(id) {
  const m = id ? MISSIONS.find(x => x.id === id) : currentMission(); if (!m) return;
  closeSimpleModal();
  if (m.view === 'detail') {
    if (state.view !== 'detail' || !state.campaigns.find(c => c.id === state.selectedCampaignId)) {
      if (!state.campaigns.length) return;
      state.selectedCampaignId = state.campaigns[0].id;
    }
    state.view = 'detail';
  } else {
    state.view = 'campaigns';
    if (m.tab) state.activeTab = m.tab;
    state.search = '';
  }
  render();
  startTour([{ target: m.target, k: 'show.' + m.id, action: true }]);
}

// Non-blocking glow on the mission's target while the guide is on.
function applyMainGuide() {
  document.querySelectorAll('#mainContent .guide-pulse').forEach(el => el.classList.remove('guide-pulse'));
  if (!state.prefs.guide || document.getElementById('createModal')) return;
  const m = currentMission();
  const sel = m && m.glow[state.view];
  if (!sel) return;
  const el = document.querySelector('#mainContent ' + sel.split(',')[0].trim()) ? document.querySelector('#mainContent ' + sel.split(',')[0].trim()) : document.querySelector(sel);
  if (el) el.classList.add('guide-pulse');
}

// ═══════════════════════════════════════════════════════════════════
// CREATE FLOW GUIDE — banner says what to do; the exact field/button glows
// ═══════════════════════════════════════════════════════════════════
function createGuideTarget() {
  const d = state.draft, s = state.createStep;
  if (s === 0) {
    if (!d.name.trim()) return { sel: '#nameInput', key: 'g.name' };
    if (!d.objective) return { sel: '#objGroup', key: 'g.objective' };
    return { sel: '#nextBtn', key: 'g.next' };
  }
  if (s === 1) return d.audience ? { sel: '#nextBtn', key: 'g.next' } : { sel: '#audGroup', key: 'g.audience' };
  if (s === 2) return d.placements.length ? { sel: '#nextBtn', key: 'g.placementsOk' } : { sel: '#placeGroup', key: 'g.placements' };
  if (s === 3) return d.budget >= 5 ? { sel: '#nextBtn', key: 'g.budgetOk' } : { sel: '#budgetInput', key: 'g.budget' };
  if (s === 4) {
    if (!d.creative.libId && !d.creative.headline.trim()) return { sel: '#libGroup', key: 'g.library' };
    if (!d.creative.headline.trim()) return { sel: '#headlineInput', key: 'g.headline' };
    if (!d.creative.body.trim()) return { sel: '#bodyInput', key: 'g.body' };
    if (isBeginner() && headlineChecks(d.creative.headline, d.creative.body).filter(c => c.ok).length < 4) return { sel: '#headlineCoach', key: 'g.headlineStars' };
    return { sel: '#nextBtn', key: 'g.creativeOk' };
  }
  return { sel: '#publishBtn', key: 'g.publish' };
}

function applyCreateGuide() {
  const modal = document.getElementById('createModal'); if (!modal) return;
  modal.querySelectorAll('.guide-pulse').forEach(el => el.classList.remove('guide-pulse'));
  if (!state.prefs.guide) return;
  const g = createGuideTarget();
  const el = modal.querySelector(g.sel);
  if (el) el.classList.add('guide-pulse');
  const banner = document.getElementById('guideBanner');
  if (banner) {
    const html = `<span class="gb-arrow">👉</span><span>${t(g.key)}</span>`;
    if (banner.innerHTML !== html) banner.innerHTML = html;
  }
}

// ═══════════════════════════════════════════════════════════════════
// POPOVER MENUS — Sound & voice, Help
// ═══════════════════════════════════════════════════════════════════
let popover = null; // { kind, anchor }

function openPopover(kind, anchor, html) {
  const same = popover && popover.kind === kind;
  closePopover();
  if (same) return;
  const el = document.createElement('div');
  el.className = 'popover';
  el.id = 'popover';
  el.setAttribute('role', 'menu');
  el.innerHTML = html;
  document.body.appendChild(el);
  popover = { kind, anchor };
  placePopover();
  setTimeout(() => document.addEventListener('click', outsidePopover, true), 0);
}
function placePopover() {
  const el = document.getElementById('popover'); if (!el || !popover) return;
  const b = popover.anchor.getBoundingClientRect(), m = 16;
  const w = el.offsetWidth;
  let left = b.right - w;
  if (b.left < window.innerWidth / 3) left = b.left; // sidebar anchor: open to the right
  el.style.left = Math.max(m, Math.min(window.innerWidth - w - m, left)) + 'px';
  el.style.top = Math.min(window.innerHeight - el.offsetHeight - m, b.bottom + 8) + 'px';
}
function outsidePopover(e) {
  const el = document.getElementById('popover');
  if (el && !el.contains(e.target) && !(popover && popover.anchor.contains(e.target))) closePopover();
}
function closePopover() {
  const el = document.getElementById('popover');
  document.removeEventListener('click', outsidePopover, true);
  const was = !!el;
  if (el) el.remove();
  popover = null;
  return was;
}
function refreshPopover() {
  if (!popover) return;
  const el = document.getElementById('popover');
  if (!el) return;
  // the anchor may have been re-rendered (top bar); re-find it by id
  if (!popover.anchor.isConnected) popover.anchor = document.getElementById(popover.kind === 'audio' ? 'audioBtn' : 'helpBtn') || document.body;
  el.innerHTML = popover.kind === 'audio' ? audioMenuHTML() : helpMenuHTML();
  placePopover();
}

function audioMenuHTML() {
  const voices = Voice.supported ? Voice.voicesFor(lang()) : [];
  const current = Voice.supported ? Voice.pick() : null;
  return `
    <div class="pop-title">${t('top.audio')}</div>
    <div class="pop-row"><div><div class="sr-title">🔊 ${t('set.sfx')}</div><div class="sr-desc">${t('set.sfx.desc')}</div></div>${switchHTML('sfx')}</div>
    <div class="pop-row"><div><div class="sr-title">🗣️ ${t('set.voice')}</div><div class="sr-desc">${Voice.supported ? t('set.voice.short') : t('voice.unsupported')}</div></div>${switchHTML('voice')}</div>
    ${Voice.supported ? `
    <div class="pop-row"><label class="sr-title" for="voiceSelect">${t('set.voiceName')}</label>
      <select id="voiceSelect" onchange="state.prefs.voiceName=this.value; saveState(); Voice.speak(t('voice.sample'), true)">
        ${voices.length ? voices.map(v => `<option value="${esc(v.name)}" ${current && current.name === v.name ? 'selected' : ''}>${esc(v.name.replace(/^(Microsoft|Google)\s+/, ''))}</option>`).join('') : `<option>${t('set.noVoices')}</option>`}
      </select></div>
    <div class="pop-row"><label class="sr-title" for="rateRange">${t('set.speed')}</label>
      <input type="range" id="rateRange" min="0.7" max="1.3" step="0.1" value="${state.prefs.rate}" onchange="state.prefs.rate=Number(this.value); saveState(); Voice.speak(t('voice.sample'), true)"></div>
    <div class="pop-row"><button class="btn btn-secondary" style="width:100%;" onclick="Voice.speak(t('voice.sample'), true)">▶ ${t('set.test')}</button></div>` : ''}
    <div class="pop-note">${t('set.hoverNote')}</div>`;
}

function helpMenuHTML() {
  const item = (icon, label, action) => `<button class="menu-item" role="menuitem" onclick="closePopover(); ${action}" data-sfx="click"><span class="mi-icon">${icon}</span>${label}</button>`;
  return `
    ${item('🧭', t('help.tour'), 'startTour(TOUR_MAIN)')}
    ${item('🎯', t('help.mission'), 'showMeMission()')}
    ${item('🧭', t('help.guide'), 'openDecisionGuide()')}
    ${item('▶️', t('help.why'), 'openIterExplainer()')}
    ${item('📝', t('help.quiz'), 'showSkillIntro()')}
    ${item('💬', t('help.piper'), 'if(!state.piperOpen)togglePiper()')}
    ${item('ℹ️', t('help.about'), 'showAbout()')}
    <div class="menu-sep"></div>
    <div class="pop-row"><div><div class="sr-title">✨ ${t('set.guide')}</div><div class="sr-desc">${t('set.guide.desc')}</div></div>${switchHTML('guide')}</div>
    <div class="menu-sep"></div>
    ${item('↺', t('help.reset'), 'confirmReset()')}`;
}

function openAudioMenu(anchor) { openPopover('audio', anchor, audioMenuHTML()); }
function openHelpMenu(anchor) { openPopover('help', anchor, helpMenuHTML()); }
function onVoicesChanged() { if (popover && popover.kind === 'audio') refreshPopover(); }
window.addEventListener('resize', placePopover);

// ═══════════════════════════════════════════════════════════════════
// ABOUT + RESET
// ═══════════════════════════════════════════════════════════════════
function showAbout() {
  openSimpleModal('ℹ️ ' + t('about.title'), `
    <div style="text-align:center;margin-bottom:10px;">${yarnLogo('welcome-logo')}</div>
    <p style="margin-bottom:12px;line-height:1.55;">${t('about.what')}</p>
    <div class="alert alert-warning"><span>⚠️</span><div>${t('about.sim')}</div></div>
    <p style="margin-bottom:8px;line-height:1.55;">${t('about.save')}</p>
    <p style="margin-bottom:8px;line-height:1.55;">${t('about.support')} <a href="mailto:help@piperssandbox.com" style="color:#0866FF;font-weight:600;">help@piperssandbox.com</a></p>
    <p class="fineprint" style="text-align:left;">${t('about.legal')}</p>`, false, true);
}

function confirmReset() {
  openSimpleModal('↺ ' + t('reset.title'), `
    <p style="margin-bottom:14px;line-height:1.55;">${t('reset.body')}</p>
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <button class="btn btn-secondary" onclick="closeSimpleModal()">${t('cancel')}</button>
      <button class="btn btn-danger" onclick="doReset()">${t('reset.confirm')}</button>
    </div>`, false, true);
}

function doReset() {
  state.campaigns = []; state.player = defaultPlayer(); state.selectedIds = []; state.view = 'campaigns'; state.search = '';
  saveState();
  closeSimpleModal();
  renderAll();
  toast(t('reset.done'));
  showSkillIntro();
}

// ═══════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════
loadState();
initMascots();
state.campaigns.forEach(migrateCampaign); // campaigns saved before the day-by-day engine get rebuilt once
renderAll();
if (!state.prefs.onboarded) {
  setTimeout(showWelcome, 300);
} else if (!state.player.assessed) {
  setTimeout(showSkillIntro, 400);
} else {
  setTimeout(() => toast(t('toast.welcomeBack', { level: levelName(currentLevel()) })), 500);
}

</script>
